    async function rsLoadShopifyStatuses() {
      try {
        const res = await apiFetch("/api/sales/shopify-statuses");
        window._rsShopifyStatuses = res.statuses || {};
        rsRenderSalesList(); // re-render with status badges
      } catch(e) { window._rsShopifyStatuses = {}; }
    }

    function rsChColor(ch) {
      if (ch === "cash" || ch === "cash_de" || ch === "cash_fr") return "#22c55e";
      if (ch === "ebay") return "#e53238";
      if (ch === "leboncoin") return "#ff6e14";
      if (ch === "ebay_kleinanzeigen") return "#86b817";
      return "var(--accent)";
    }
    function rsChLabel(ch) {
      if (ch === "cash_de") return "CASH DE";
      if (ch === "cash_fr") return "CASH FR";
      if (ch === "ebay_kleinanzeigen") return "KA";
      return (ch || "—").toUpperCase();
    }

    function rsShopifyBadge(sku) {
      const statuses = window._rsShopifyStatuses || {};
      const info = statuses[sku];
      if (!info || !sku || sku.startsWith("NOSSKU-")) return '';
      const st = info.status || 'unknown';
      let label = st;
      let cls = st;
      if (st === 'unlisted') { label = 'unlisted'; cls = 'unlisted'; }
      else if (st === 'active' && info.inventory !== null && info.inventory <= 0) { label = 'active · stock 0'; cls = 'unlisted'; }
      else if (st === 'active') { label = 'active'; }
      else if (st === 'draft') { label = 'draft'; }
      else if (st === 'archived') { label = 'archived'; }
      else if (st === 'not_found') { label = 'not on shopify'; }
      return '<span class="rs-shopify-badge ' + cls + '">' + label + '</span>';
    }

    const RS_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    function rsInitDateSelectors() {
      const now = new Date();
      const dayEl = document.getElementById('rs-day');
      const monthEl = document.getElementById('rs-month');
      const yearEl = document.getElementById('rs-year');
      if (!dayEl || !monthEl || !yearEl) return;

      // Days 1-31
      dayEl.innerHTML = '';
      for (let d = 1; d <= 31; d++) {
        const opt = document.createElement('option');
        opt.value = d;
        opt.textContent = String(d).padStart(2, '0');
        dayEl.appendChild(opt);
      }
      dayEl.value = now.getDate();

      // Months
      monthEl.innerHTML = '';
      RS_MONTHS.forEach((m, i) => {
        const opt = document.createElement('option');
        opt.value = i + 1;
        opt.textContent = m;
        monthEl.appendChild(opt);
      });
      monthEl.value = now.getMonth() + 1;

      // Years (current year and previous)
      yearEl.innerHTML = '';
      const curYear = now.getFullYear();
      for (let y = curYear; y >= curYear - 2; y--) {
        const opt = document.createElement('option');
        opt.value = y;
        opt.textContent = y;
        yearEl.appendChild(opt);
      }
      yearEl.value = curYear;
    }

    function rsGetSelectedDate() {
      const d = document.getElementById('rs-day')?.value;
      const m = document.getElementById('rs-month')?.value;
      const y = document.getElementById('rs-year')?.value;
      if (!d || !m || !y) return null;
      return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    }

    function rsResetDateToToday() {
      const now = new Date();
      const dayEl = document.getElementById('rs-day');
      const monthEl = document.getElementById('rs-month');
      const yearEl = document.getElementById('rs-year');
      if (dayEl) dayEl.value = now.getDate();
      if (monthEl) monthEl.value = now.getMonth() + 1;
      if (yearEl) yearEl.value = now.getFullYear();
    }

    // ── Stats & Chart ──────────────────────────────────────────────
    let _rsChartDays = 7;

    function rsPickChartRange(btn) {
      document.querySelectorAll('#rs-chart-pills .rs-chart-pill').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      _rsChartDays = parseInt(btn.dataset.days);
      rsRenderChart();
    }

    function rsComputeStats() {
      const allSales = window._rsSalesData || [];
      const now = new Date();
      const msDay = 86400000;

      function salesInDays(n) {
        const cutoff = new Date(now.getTime() - n * msDay);
        return allSales.filter(s => s.sold_at && new Date(s.sold_at) >= cutoff);
      }

      const s7 = salesInDays(7), s30 = salesInDays(30), s90 = salesInDays(90);
      const r7 = s7.reduce((a, s) => a + (s.sale_price || 0), 0);
      const r30 = s30.reduce((a, s) => a + (s.sale_price || 0), 0);
      const r90 = s90.reduce((a, s) => a + (s.sale_price || 0), 0);

      return {
        total7: r7, total30: r30, total90: r90,
        count7: s7.length, count30: s30.length, count90: s90.length,
        avg7: r7 / 7,
        avg30: r30 / 30,
        avg90: r90 / 90,
      };
    }

    function rsRenderStats() {
      const el = document.getElementById("rs-stats-grid");
      if (!el) return;
      const s = rsComputeStats();

      function card(value, label) {
        return '<div class="rs-stat-card"><div class="rs-stat-value">' + value + '</div><div class="rs-stat-label">' + label + '</div></div>';
      }
      function eur(v) { return v >= 1000 ? (v / 1000).toFixed(1) + 'K' : v.toFixed(0); }

      el.innerHTML =
        card(eur(s.total7) + ' \u20AC', 'Total 7d') +
        card(eur(s.total30) + ' \u20AC', 'Total 30d') +
        card(eur(s.total90) + ' \u20AC', 'Total 90d') +
        card(eur(s.avg7) + ' \u20AC', 'Avg/day 7d') +
        card(eur(s.avg30) + ' \u20AC', 'Avg/day 30d') +
        card(eur(s.avg90) + ' \u20AC', 'Avg/day 90d') +
        card(s.count7, 'Sales 7d') +
        card(s.count30, 'Sales 30d') +
        card(s.count90, 'Sales 90d');
    }

    function rsRenderChart() {
      const el = document.getElementById("rs-chart");
      if (!el) return;
      const allSales = window._rsSalesData || [];
      const days = _rsChartDays;
      const now = new Date();
      const msDay = 86400000;

      // Build daily buckets (using local dates)
      function localDateKey(date) {
        const y = date.getFullYear(), m = String(date.getMonth() + 1).padStart(2, '0'), d = String(date.getDate()).padStart(2, '0');
        return y + '-' + m + '-' + d;
      }
      const buckets = [];
      for (let i = days - 1; i >= 0; i--) {
        const d = new Date(now.getTime() - i * msDay);
        const key = localDateKey(d);
        buckets.push({ key, label: d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' }), revenue: 0, count: 0 });
      }

      allSales.forEach(s => {
        if (!s.sold_at) return;
        const key = localDateKey(new Date(s.sold_at));
        const b = buckets.find(b => b.key === key);
        if (b) { b.revenue += (s.sale_price || 0); b.count++; }
      });

      const maxRev = Math.max(...buckets.map(b => b.revenue), 1);
      const w = el.clientWidth || 480;
      const h = 160;
      const padTop = 16, padBot = 24, padLeft = 4, padRight = 4;
      const chartH = h - padTop - padBot;
      const barCount = buckets.length;
      const gap = Math.max(2, Math.min(6, Math.floor(w / barCount * 0.2)));
      const barW = Math.max(4, (w - padLeft - padRight - gap * barCount) / barCount);

      // Grid lines
      let gridLines = '';
      for (let i = 0; i <= 3; i++) {
        const y = padTop + chartH * (1 - i / 3);
        gridLines += '<line class="rs-chart-grid" x1="' + padLeft + '" x2="' + (w - padRight) + '" y1="' + y + '" y2="' + y + '"/>';
      }

      // Bars + labels
      let bars = '';
      buckets.forEach((b, i) => {
        const x = padLeft + i * (barW + gap) + gap / 2;
        const barH = b.revenue > 0 ? Math.max(3, (b.revenue / maxRev) * chartH) : 0;
        const y = padTop + chartH - barH;

        bars += '<rect class="rs-chart-bar" x="' + x + '" y="' + y + '" width="' + barW + '" height="' + barH + '"/>';

        // Value on top
        if (b.revenue > 0) {
          bars += '<text class="rs-chart-val" x="' + (x + barW / 2) + '" y="' + (y - 3) + '">' + (b.revenue >= 1000 ? (b.revenue / 1000).toFixed(1) + 'K' : b.revenue.toFixed(0)) + '</text>';
        }

        // Date label (show every Nth to avoid overlap)
        const showLabel = days <= 7 || (days <= 30 && i % 7 === 0) || (days <= 90 && i % 14 === 0) || i === barCount - 1;
        if (showLabel) {
          const lbl = days <= 7 ? b.label : b.key.slice(5);
          bars += '<text class="rs-chart-label" x="' + (x + barW / 2) + '" y="' + (h - 4) + '">' + lbl + '</text>';
        }
      });

      if (buckets.every(b => b.revenue === 0)) {
        el.innerHTML = '<div class="rs-chart-empty">No data for this period</div>';
        return;
      }

      el.innerHTML = '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' + gridLines + bars + '</svg>';
    }

    function rsGetFilteredSales() {
      const allSales = window._rsSalesData || [];
      const q = (window._rsSearchQuery || '').trim().toLowerCase();
      if (!q) return allSales;
      return allSales.filter(s => (s.sku || '').toLowerCase().includes(q));
    }

    function rsOnSearch(input) {
      window._rsSearchQuery = input.value;
      rsPageOffset = 0;
      rsRenderSalesList();
      rsRenderShopifySoldList();
      rsRenderEbaySalesList();
    }

    function rsRenderSalesList() {
      const filtered = rsGetFilteredSales();
      const page = filtered.slice(rsPageOffset, rsPageOffset + RS_PAGE_SIZE);
      const listEl = document.getElementById("rs-list");
      const pagEl = document.getElementById("rs-pagination");
      if (!listEl) return;

      if (filtered.length === 0) {
        listEl.innerHTML = '<div class="rs-empty">' + (window._rsSearchQuery ? 'No match' : 'No sales recorded yet') + '</div>';
        pagEl.innerHTML = '';
        return;
      }

      listEl.innerHTML = page.map(s => {
        const hasMeta = (s.customer_name) || (s.notes && s.notes !== 'Recorded from dashboard');
        return `
        <div class="rs-sale-row" id="rs-row-${s.sale_id}">
          <div class="rs-sale-line1">
            <span class="rs-sale-sku">${s.sku || '—'}</span>
            <span class="rs-sale-price">${s.sale_price ? s.sale_price.toFixed(2) + ' €' : '—'}</span>
            <button class="rs-del-btn" onclick="rsDeleteSale('${s.sale_id}', this)" title="Delete">✕</button>
          </div>
          <div class="rs-sale-line2">
            <span class="rs-sale-ch" style="color:${rsChColor(s.channel)}">${rsChLabel(s.channel)}</span>
            ${rsShopifyBadge(s.sku)}
            <span class="rs-sale-date">${s.sold_at ? new Date(s.sold_at).toLocaleDateString('fr-FR', {day:'2-digit',month:'short'}) : ''}</span>
            ${hasMeta ? '<span class="rs-sale-meta">' + (s.customer_name || '') + (s.customer_name && s.notes && s.notes !== 'Recorded from dashboard' ? ' · ' : '') + (s.notes && s.notes !== 'Recorded from dashboard' ? s.notes : '') + '</span>' : ''}
          </div>
        </div>`;
      }).join("");

      const totalPages = Math.ceil(filtered.length / RS_PAGE_SIZE);
      const currentPage = Math.floor(rsPageOffset / RS_PAGE_SIZE) + 1;
      if (totalPages > 1) {
        pagEl.innerHTML = `
          <button class="rs-pager-btn" onclick="rsGotoPage(-1)" ${rsPageOffset === 0 ? 'disabled' : ''}>Previous</button>
          <span style="font-size:13px;color:var(--text-tertiary);align-self:center">${currentPage} / ${totalPages}</span>
          <button class="rs-pager-btn" onclick="rsGotoPage(1)" ${rsPageOffset + RS_PAGE_SIZE >= filtered.length ? 'disabled' : ''}>Next</button>
        `;
      } else {
        pagEl.innerHTML = '';
      }
    }

    function rsGotoPage(dir) {
      const allSales = window._rsSalesData || [];
      rsPageOffset += dir * RS_PAGE_SIZE;
      if (rsPageOffset < 0) rsPageOffset = 0;
      if (rsPageOffset >= allSales.length) rsPageOffset = Math.max(0, allSales.length - RS_PAGE_SIZE);
      rsRenderSalesList();
      document.getElementById("rs-list").scrollIntoView({ behavior: "smooth" });
    }

    function rsDownloadExcel() {
      const sales = window._rsSalesData || [];
      if (!sales.length) { rsToast('No sales to export', true); return; }

      // Build CSV content (Excel-compatible with BOM)
      const headers = ['Sale ID','SKU','Channel','Price (EUR)','Customer','Notes','Date'];
      const rows = sales.map(s => [
        s.sale_id,
        s.sku || '',
        s.channel || '',
        s.sale_price != null ? s.sale_price.toFixed(2) : '',
        (s.customer_name || '').replace(/"/g, '""'),
        (s.notes && s.notes !== 'Recorded from dashboard' ? s.notes : '').replace(/"/g, '""'),
        s.sold_at ? new Date(s.sold_at).toISOString().slice(0, 10) : ''
      ]);
      const csv = '\uFEFF' + [headers, ...rows].map(r => r.map(c => '"' + c + '"').join(',')).join('\n');

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'sales_export_' + new Date().toISOString().slice(0, 10) + '.csv';
      a.click();
      URL.revokeObjectURL(url);
    }

    function rsToggleNoSku() {
      // Let the native checkbox toggle first
      setTimeout(() => {
        const checked = document.getElementById("rs-no-sku").checked;
        const skuField = document.getElementById("rs-sku-field");
        const skuInput = document.getElementById("rs-sku");
        if (checked) {
          skuField.style.opacity = "0.4";
          skuInput.disabled = true;
          skuInput.required = false;
          skuInput.value = "";
          document.getElementById("rs-price").focus();
        } else {
          skuField.style.opacity = "1";
          skuInput.disabled = false;
          skuInput.required = true;
          skuInput.focus();
        }
      }, 0);
    }

    let _delArmed = null;
    let _delTimer = null;
    async function rsDeleteSale(saleId, btn) {
      if (_delArmed !== saleId) {
        // First tap — arm
        if (_delArmed) {
          // Reset previous armed button
          const prev = document.querySelector('.rs-del-btn.armed');
          if (prev) { prev.classList.remove('armed'); prev.textContent = '✕'; }
        }
        _delArmed = saleId;
        btn.classList.add('armed');
        btn.textContent = '?';
        clearTimeout(_delTimer);
        _delTimer = setTimeout(() => {
          _delArmed = null;
          btn.classList.remove('armed');
          btn.textContent = '✕';
        }, 3000);
        return;
      }
      // Second tap — delete
      _delArmed = null;
      clearTimeout(_delTimer);
      btn.textContent = '…';
      try {
        const res = await fetch('/api/sales/' + encodeURIComponent(saleId), { method: 'DELETE' });
        if (!res.ok && res.status !== 204) throw new Error('HTTP ' + res.status);
        // Remove from local cache immediately
        if (window._rsSalesData) {
          window._rsSalesData = window._rsSalesData.filter(s => String(s.sale_id) !== String(saleId));
        }
        // Update the today counter and total badge
        const allSales = window._rsSalesData || [];
        const today = new Date().toISOString().slice(0, 10);
        const todaySales = allSales.filter(s => s.sold_at && s.sold_at.startsWith(today));
        const todayRev = todaySales.reduce((sum, s) => sum + (s.sale_price || 0), 0);
        const totalRevenue = allSales.reduce((sum, s) => sum + (s.sale_price || 0), 0);
        const cntEl = document.getElementById("rs-today-count");
        const revEl = document.getElementById("rs-today-rev");
        const badgeEl = document.getElementById("rs-total-badge");
        if (cntEl) cntEl.textContent = todaySales.length;
        if (revEl) revEl.textContent = todayRev.toFixed(2) + " EUR";
        if (badgeEl) badgeEl.textContent = allSales.length + " sales \u00b7 " + totalRevenue.toFixed(2) + " EUR";
        // Re-render lists from updated cache
        rsRenderSalesList();
        rsRenderStats();
        rsRenderChart();
        rsLoadEbaySold();
        rsLoadShopifySold();
        rsToast('Sale deleted', true);
      } catch (e) {
        btn.textContent = '✕';
        btn.classList.remove('armed');
        rsToast('Delete failed: ' + e.message, false);
      }
    }

    function rsToast(msg, ok) {
      const t = document.getElementById("rs-toast");
      if (!t) return;
      t.textContent = msg;
      t.className = "rs-toast " + (ok ? "success" : "error") + " show";
      setTimeout(() => { t.classList.remove("show"); }, 3000);
    }

    async function rsSubmit(event) {
      event.preventDefault();
      const noSku = document.getElementById("rs-no-sku").checked;
      const sku = noSku ? ("NOSSKU-" + Date.now()) : document.getElementById("rs-sku").value.trim();
      const price = parseFloat(document.getElementById("rs-price").value);
      const channel = document.getElementById("rs-channel").value;
      const customer = document.getElementById("rs-customer").value.trim();
      const notes = document.getElementById("rs-notes").value.trim();
      const saleDate = rsGetSelectedDate();
      const btn = document.getElementById("rs-submit-btn");

      if (!noSku && !sku) { rsToast("SKU is required (or check No SKU)", false); return; }
      if (!price) { rsToast("Price is required", false); return; }

      // Duplicate SKU check (skip for no-SKU sales)
      if (!noSku) {
        const existing = (window._rsSalesData || []).find(s => s.sku === sku);
        if (existing) {
          rsToast("SKU " + sku + " is already in the list", false);
          return;
        }
      }

      btn.disabled = true;
      btn.textContent = "Saving...";
      try {
        const soldAt = saleDate ? new Date(saleDate + "T12:00:00").toISOString() : null;
        await apiPost("/api/sales/", {
          sku, channel, sale_price: price, quantity: 1,
          customer_name: customer || null,
          notes: notes || (noSku ? "No SKU sale" : "Recorded from dashboard"),
          sold_at: soldAt
        });
        const label = noSku ? "No-SKU sale" : ("SKU " + sku);
        rsToast("Sale recorded: " + label + " — " + price.toFixed(2) + " EUR", true);
        document.getElementById("rs-form").reset();
        // Reset date to today
        rsResetDateToToday();
        // Reset channel to cash_de
        document.getElementById("rs-channel").value = "cash_de";
        document.querySelectorAll('#rs-pills .rs-pill').forEach(p => p.classList.remove('active'));
        document.querySelector('#rs-pills .rs-pill[data-ch="cash_de"]').classList.add('active');
        // Reset no-sku state
        document.getElementById("rs-sku-field").style.opacity = "1";
        document.getElementById("rs-sku").disabled = false;
        document.getElementById("rs-sku").required = true;
        // Refresh the sales list without full page re-render
        setTimeout(async () => {
          try {
            const r = await apiFetch("/api/sales/?limit=500");
            const allSales = Array.isArray(r) ? r : [];
            window._rsSalesData = allSales;
            // Update today stats
            const today = new Date().toISOString().slice(0, 10);
            const todaySales = allSales.filter(s => s.sold_at && s.sold_at.startsWith(today));
            const todayRevenue = todaySales.reduce((sum, s) => sum + (s.sale_price || 0), 0);
            const totalRevenue = allSales.reduce((sum, s) => sum + (s.sale_price || 0), 0);
            const countEl = document.querySelector(".rs-today-count");
            const labelEl = document.querySelector(".rs-today-label");
            const revEl = document.querySelector(".rs-today-revenue");
            const badgeEl = document.querySelector(".rs-total-badge");
            if (countEl) countEl.textContent = todaySales.length;
            if (labelEl) labelEl.textContent = "sale" + (todaySales.length !== 1 ? "s" : "") + " today";
            if (revEl) revEl.textContent = todayRevenue.toFixed(2) + " EUR";
            if (badgeEl) badgeEl.textContent = allSales.length + " sales \u00b7 " + totalRevenue.toFixed(2) + " EUR";
            rsPageOffset = 0;
            rsRenderSalesList();
            rsRenderStats();
            rsRenderChart();
            rsLoadEbaySold();
            rsLoadShopifyStatuses();
            rsLoadShopifySold();
          } catch(e) { console.error("Failed to refresh sales list:", e); }
          document.getElementById("rs-sku").focus();
        }, 800);
      } catch (e) {
        rsToast("Error: " + e.message, false);
      } finally {
        btn.disabled = false;
        btn.textContent = "Record Sale";
      }
    }

    const SYNC_LABEL = "Sync All to Shopify (unlist all SKUs)";
    let _syncTapCount = 0;
    let _syncTimer = null;

    function _syncReset() {
      _syncTapCount = 0;
      clearTimeout(_syncTimer);
      const btn = document.getElementById("rs-sync-btn");
      if (btn) { btn.textContent = SYNC_LABEL; btn.style.borderColor = ""; btn.style.color = ""; }
    }

    function rsSyncShopifyStep() {
      const btn = document.getElementById("rs-sync-btn");

      _syncTapCount++;
      clearTimeout(_syncTimer);
      _syncTimer = setTimeout(_syncReset, 4000);

      if (_syncTapCount === 1) {
        btn.textContent = "Tap 2 more times to confirm";
        btn.style.borderColor = "var(--warning, orange)";
        btn.style.color = "var(--warning, orange)";
      } else if (_syncTapCount === 2) {
        btn.textContent = "Tap once more to unlist ALL";
        btn.style.borderColor = "var(--danger)";
        btn.style.color = "var(--danger)";
      } else if (_syncTapCount >= 3) {
        _syncTapCount = 0;
        clearTimeout(_syncTimer);
        btn.textContent = "Syncing all…";
        btn.style.borderColor = "";
        btn.style.color = "";
        rsSyncAllConfirmed(btn);
      }
    }

    async function rsSyncAllConfirmed(btn) {
      try {
        const res = await apiPost("/api/sales/sync-shopify-all", {});
        const synced = res.synced || 0;
        const notFound = (res.not_found || []).length;
        let msg = synced + " SKU" + (synced !== 1 ? "s" : "") + " unlisted on Shopify";
        if (notFound) msg += " (" + notFound + " not found)";
        rsToast(msg, true);
        rsLoadShopifyStatuses();
        rsLoadShopifySold();
      } catch (e) {
        rsToast("Sync error: " + e.message, false);
      } finally {
        btn.textContent = SYNC_LABEL;
      }
    }

    // ── List 2: Sold on Shopify (active, stock 0, not in recorded sales) ──
    async function rsLoadShopifySold() {
      try {
        const res = await apiFetch("/api/sales/shopify-sold");
        const products = res.products || [];
        window._rsShopifySoldData = products;
        rsRenderShopifySoldList();
      } catch(e) {
        const el = document.getElementById("rs-shopify-sold-list");
        if (el) el.innerHTML = '<div class="rs-empty">Could not load</div>';
      }
    }

    function rsRenderShopifySoldList() {
      const all = window._rsShopifySoldData || [];
      const q = (window._rsSearchQuery || '').trim().toLowerCase();
      const products = q ? all.filter(p => (p.sku || '').toLowerCase().includes(q)) : all;
      const listEl = document.getElementById("rs-shopify-sold-list");
      const badgeEl = document.getElementById("rs-shopify-sold-badge");
      if (!listEl) return;
      if (badgeEl) badgeEl.textContent = products.length + " product" + (products.length !== 1 ? "s" : "");

      if (products.length === 0) {
        listEl.innerHTML = '<div class="rs-empty">' + (q ? 'No match' : 'No Shopify-sold products found') + '</div>';
        return;
      }

      listEl.innerHTML = products.map(p => `
        <div class="rs-sale-row">
          <div class="rs-sale-line1">
            <span class="rs-sale-sku">${p.sku}</span>
            <span class="rs-shopify-badge active">shopify</span>
            <span style="font-size:12px;color:var(--text-secondary);margin-left:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.title || ''}</span>
            <span class="rs-sale-price" style="margin-left:auto">stock ${p.inventory}</span>
          </div>
        </div>
      `).join("");
    }

    // ── List 3: eBay Sales (sold/ended from eBay API) ──────────────
    async function rsLoadEbaySold() {
      // Try to reuse already-loaded product data from eBay tab
      if (state.products && state.products.length) {
        const sold = [];
        state.products.forEach(p => {
          const ebay = getEbayMeta(p);
          if (ebay && ebay.ebay_status === 'ENDED') {
            const sku = (p.variants || [{}])[0]?.sku || '—';
            sold.push({ sku, title: p.title || '', listing_id: ebay.listing_id, ebay_url: ebay.ebay_url || '' });
          }
        });
        window._rsEbaySoldData = sold;
        rsRenderEbaySalesList();
        return;
      }
      // Fallback: load from API
      const el = document.getElementById("rs-ebay-list");
      if (el) el.innerHTML = '<div class="rs-empty" style="font-size:12px">Loading eBay data…</div>';
      try {
        const res = await apiFetch("/api/ebay/listings");
        window._rsEbaySoldData = (res.listings || []).filter(l => l.ebay_status === 'ENDED');
        rsRenderEbaySalesList();
      } catch(e) {
        if (el) el.innerHTML = '<div class="rs-empty">Could not load eBay data</div>';
      }
    }

    function rsRenderEbaySalesList() {
      const all = window._rsEbaySoldData || [];
      const q = (window._rsSearchQuery || '').trim().toLowerCase();
      const listings = q ? all.filter(l => (l.sku || '').toLowerCase().includes(q)) : all;
      const listEl = document.getElementById("rs-ebay-list");
      const badgeEl = document.getElementById("rs-ebay-badge");
      if (!listEl) return;
      if (badgeEl) badgeEl.textContent = listings.length + " sold";

      if (listings.length === 0) {
        listEl.innerHTML = '<div class="rs-empty">' + (q ? 'No match' : 'No eBay sold items') + '</div>';
        return;
      }

      listEl.innerHTML = listings.map(l => `
        <div class="rs-sale-row">
          <div class="rs-sale-line1">
            <span class="rs-sale-sku">${l.sku || '—'}</span>
            <span style="font-size:12px;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:4px">${l.title || ''}</span>
          </div>
          <div class="rs-sale-line2">
            <span class="rs-sale-ch" style="color:#e53238">EBAY</span>
            <span class="rs-shopify-badge" style="background:rgba(229,50,56,0.15);color:#e53238">SOLD</span>
            ${l.ebay_url ? '<a href="' + l.ebay_url + '" target="_blank" style="font-size:10px;color:var(--accent)">#' + (l.listing_id || 'link') + '</a>' : ''}
          </div>
        </div>
      `).join("");
    }

    async function renderCustomers(el) {
      el.innerHTML = `<div class="stats-grid">${statCard("Loading...", null, true)}</div><div class="table-container"><table><tbody><tr><td colspan="5" class="loading-cell"><span class="pulse">Loading...</span></td></tr></tbody></table></div>`;
      try {
        const [cRes, countRes] = await Promise.all([apiFetch("/api/customers?limit=50"), apiFetch("/api/customers/count")]);
        const customers = cRes.customers || []; const count = countRes.count ?? 0;
        const totalSpent = customers.reduce((s, c) => s + parseFloat(c.total_spent || 0), 0);
        el.innerHTML = `
          <div class="stats-grid fade-in">${statCard("Total Customers", count, true)}${statCard("With Orders", customers.filter(c => c.orders_count > 0).length)}${statCard("Total Spent", money(totalSpent))}${statCard("Avg. Spent", customers.length ? money(totalSpent / customers.length) : "—")}</div>
          <div class="table-container fade-in"><div class="table-header"><h3>Customers</h3></div>
          <table><thead><tr><th>Name</th><th>Email</th><th>Orders</th><th>Total Spent</th><th>Location</th></tr></thead>
          <tbody>${customers.map(c => `<tr><td>${((c.first_name||"")+" "+(c.last_name||"")).trim()||"—"}</td><td>${c.email||"—"}</td><td class="mono">${c.orders_count||0}</td><td class="mono">${money(c.total_spent)}</td><td>${c.default_address ? (c.default_address.city||"")+", "+(c.default_address.country||"") : "—"}</td></tr>`).join("")}
          </tbody></table></div>`;
      } catch (e) { el.innerHTML = `<div class="empty-state"><p>Error: ${e.message}</p></div>`; }
    }

    async function renderInventory(el) {
      el.innerHTML = `<div class="table-container"><table><tbody><tr><td colspan="5" class="loading-cell"><span class="pulse">Loading...</span></td></tr></tbody></table></div>`;
      try {
        const res = await apiFetch("/api/inventory/locations");
        const locations = res.locations || [];
        el.innerHTML = `
          <div class="stats-grid fade-in">${statCard("Locations", locations.length, true)}${statCard("Active", locations.filter(l => l.active).length)}</div>
          <div class="table-container fade-in"><div class="table-header"><h3>Inventory Locations</h3></div>
          <table><thead><tr><th>Location</th><th>Address</th><th>City</th><th>Country</th><th>Active</th></tr></thead>
          <tbody>${locations.map(l => `<tr><td>${l.name}</td><td>${l.address1||"—"}</td><td>${l.city||"—"}</td><td>${l.country_name||l.country||"—"}</td><td style="color:${l.active?'var(--success)':'var(--text-tertiary)'}">${l.active?'✓ Yes':'No'}</td></tr>`).join("")}
          </tbody></table></div>`;
      } catch (e) { el.innerHTML = `<div class="empty-state"><p>Error: ${e.message}</p></div>`; }
    }

    // ── Settings ────────────────────────────────────────────────────
    function renderSettings(el) {
      el.innerHTML = `
        <div class="settings-panel fade-in">
          <div class="settings-group">
            <h3>API Connection</h3>
            <div class="field">
              <label>API Base URL</label>
              <input id="api-url-input" value="${state.apiUrl}" placeholder="https://shopify-publisher-production.up.railway.app" />
              <div class="hint">Leave empty to auto-detect (same origin)</div>
            </div>
            <div style="display:flex;gap:8px;margin-top:16px">
              <button class="btn btn-accent" onclick="testConnection()">Test Connection</button>
              <button class="btn" onclick="saveApiUrl()">Save</button>
            </div>
            <div id="connection-status"></div>
          </div>
          <div class="settings-group">
            <h3>Metafield Mapping</h3>
            <p style="font-size:13px;color:var(--text-secondary);line-height:1.6">
              The dashboard looks for these metafield keys on your products:<br>
              <code style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);background:var(--bg-tertiary);padding:2px 6px;border-radius:4px;display:inline-block;margin-top:8px">
                ${TIRE_FIELDS.map(f => f.key).join(", ")}
              </code><br><br>
              Make sure your Shopify metafield keys match (namespace doesn't matter). The dashboard will fuzzy-match keys containing these terms.
            </p>
          </div>
        </div>`;
    }

    async function testConnection() {
      const url = document.getElementById("api-url-input").value.replace(/\/$/, "");
      const s = document.getElementById("connection-status");
      s.innerHTML = `<div class="connection-status testing"><span class="pulse">Testing...</span></div>`;
      try {
        const res = await fetch(url + "/health");
        if (res.ok) { state.apiUrl = url; state.connected = true; document.getElementById("sidebar-host").textContent = url ? new URL(url).host : window.location.host; s.innerHTML = `<div class="connection-status connected">${ICONS.check} Connected</div>`; }
        else s.innerHTML = `<div class="connection-status disconnected">${ICONS.alert} Failed (HTTP ${res.status})</div>`;
      } catch (e) { s.innerHTML = `<div class="connection-status disconnected">${ICONS.alert} Failed — check URL</div>`; }
    }

    function saveApiUrl() {
      state.apiUrl = document.getElementById("api-url-input").value.replace(/\/$/, "");
      state.connected = true;
      document.getElementById("sidebar-host").textContent = state.apiUrl ? new URL(state.apiUrl).host : window.location.host;
      navigate(_defaultPage());
    }

    function _defaultPage() {
      return window.innerWidth <= 900 ? "record-sale" : "tires";
    }

    // ── Auto-detect ─────────────────────────────────────────────────
    async function autoDetect() {
      try {
        const res = await fetch("/health");
        if (res.ok) {
          state.apiUrl = "";
          state.connected = true;
          document.getElementById("sidebar-host").textContent = window.location.host;
          navigate(_defaultPage());
          return;
        }
      } catch (e) {}
      navigate("settings");
    }
    autoDetect();
  </script>
</body>
</html>
