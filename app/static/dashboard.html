<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tire Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-primary: #0a0a0b;
      --bg-secondary: #111113;
      --bg-tertiary: #18181b;
      --bg-elevated: #1e1e22;
      --bg-hover: #252529;
      --border: #2a2a2e;
      --border-subtle: #222225;
      --text-primary: #f0f0f2;
      --text-secondary: #8b8b94;
      --text-tertiary: #5a5a63;
      --accent: #c8ff00;
      --accent-dim: #c8ff0018;
      --accent-mid: #c8ff0040;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --info: #3b82f6;
      --winter: #60a5fa;
      --summer: #fb923c;
      --allseason: #a78bfa;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg-primary); color: var(--text-primary); -webkit-font-smoothing: antialiased; }
    .dashboard { display: flex; height: 100vh; overflow: hidden; }

    /* Sidebar */
    .sidebar { width: 240px; background: var(--bg-secondary); border-right: 1px solid var(--border-subtle); display: flex; flex-direction: column; flex-shrink: 0; }
    .sidebar-brand { padding: 24px 20px 20px; border-bottom: 1px solid var(--border-subtle); }
    .sidebar-brand h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; }
    .sidebar-brand .host { font-size: 11px; color: var(--text-tertiary); font-family: 'JetBrains Mono', monospace; margin-top: 4px; }
    .sidebar-nav { padding: 12px 10px; flex: 1; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 13.5px; color: var(--text-secondary); transition: all 0.15s ease; margin-bottom: 2px; border: 1px solid transparent; }
    .nav-item:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .nav-item.active { background: var(--accent-dim); color: var(--accent); font-weight: 500; border-color: var(--accent-mid); }
    .nav-item.active svg { stroke: var(--accent); }
    .nav-badge { margin-left: auto; background: var(--bg-elevated); color: var(--text-tertiary); font-size: 11px; font-family: 'JetBrains Mono', monospace; padding: 2px 7px; border-radius: 4px; }
    .nav-item.active .nav-badge { background: var(--accent-mid); color: var(--accent); }
    .nav-warn { background: #ef444430 !important; color: var(--danger) !important; }

    /* Main */
    .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .topbar { padding: 18px 28px; border-bottom: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: space-between; background: var(--bg-secondary); }
    .topbar h2 { font-size: 18px; font-weight: 600; letter-spacing: -0.4px; }
    .topbar-actions { display: flex; gap: 8px; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 7px; border: 1px solid var(--border); background: var(--bg-tertiary); color: var(--text-secondary); font-size: 12.5px; font-family: 'DM Sans', sans-serif; font-weight: 500; cursor: pointer; transition: all 0.15s ease; }
    .btn:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--text-tertiary); }
    .btn-accent { background: var(--accent); color: #0a0a0b; border-color: var(--accent); }
    .btn-accent:hover { background: #b8ee00; color: #0a0a0b; }
    .content-area { flex: 1; overflow-y: auto; padding: 24px 28px; }

    /* Stats */
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
    .stat-card { background: var(--bg-secondary); border: 1px solid var(--border-subtle); border-radius: 10px; padding: 18px 20px; transition: border-color 0.2s; }
    .stat-card:hover { border-color: var(--border); }
    .stat-label { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-tertiary); font-weight: 500; margin-bottom: 8px; }
    .stat-value { font-size: 28px; font-weight: 700; letter-spacing: -1px; font-family: 'JetBrains Mono', monospace; }
    .stat-value.accent { color: var(--accent); }

    /* Filters Bar */
    .filters-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
    .filter-group { display: flex; flex-direction: column; gap: 4px; }
    .filter-group label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-tertiary); font-weight: 500; }
    .filter-select, .filter-input {
      background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 7px;
      padding: 7px 10px; color: var(--text-primary); font-family: 'DM Sans', sans-serif;
      font-size: 12.5px; outline: none; transition: border-color 0.15s; min-width: 130px;
    }
    .filter-select:focus, .filter-input:focus { border-color: var(--accent); }
    .filter-select option { background: var(--bg-tertiary); }
    .filter-input::placeholder { color: var(--text-tertiary); }
    .filter-reset { margin-top: 16px; }

    /* Tire Cards */
    .tire-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
    .tire-card { background: var(--bg-secondary); border: 1px solid var(--border-subtle); border-radius: 12px; overflow: hidden; transition: border-color 0.2s, transform 0.2s; cursor: pointer; }
    .tire-card:hover { border-color: var(--border); transform: translateY(-2px); }
    .tire-card-images { display: flex; gap: 2px; height: 180px; overflow: hidden; background: var(--bg-tertiary); position: relative; }
    .tire-card-images img { flex: 1; object-fit: cover; min-width: 0; transition: opacity 0.2s; }
    .tire-card-images img:hover { opacity: 0.85; }
    .tire-card-images .no-img { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-tertiary); font-size: 12px; }
    .sku-overlay {
      position: absolute; top: 8px; left: 8px;
      background: rgba(0,0,0,0.75); backdrop-filter: blur(4px);
      color: var(--accent); font-family: 'JetBrains Mono', monospace;
      font-size: 11px; font-weight: 500; padding: 3px 8px;
      border-radius: 5px; letter-spacing: 0.3px; z-index: 2;
    }
    .sku-tag {
      flex-shrink: 0;
      background: var(--accent-dim); color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px; font-weight: 500; padding: 2px 8px;
      border-radius: 5px; border: 1px solid var(--accent-mid);
      letter-spacing: 0.3px; white-space: nowrap;
    }
    .row-thumb {
      width: 40px; height: 40px; border-radius: 6px; object-fit: cover;
      border: 1px solid var(--border-subtle);
    }
    .row-thumb-empty {
      width: 40px; height: 40px; border-radius: 6px;
      background: var(--bg-tertiary); border: 1px solid var(--border-subtle);
      display: flex; align-items: center; justify-content: center;
      color: var(--text-tertiary); font-size: 11px;
    }
    .tire-row:hover .sku-tag { background: var(--accent-mid); }

    /* Pic count */
    .pic-count {
      font-family: 'JetBrains Mono', monospace; font-size: 11.5px;
      padding: 2px 7px; border-radius: 5px; white-space: nowrap;
    }
    .pic-count.good { background: #22c55e14; color: var(--success); }
    .pic-count.low { background: #f59e0b14; color: var(--warning); }
    .pic-count.none { background: #ef444414; color: var(--danger); }

    /* Studio pic counts */
    .studio-count {
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
      padding: 2px 7px; border-radius: 5px; white-space: nowrap;
      background: #3b82f614; color: var(--info);
    }
    .studio-count.empty { background: var(--bg-tertiary); color: var(--text-tertiary); }

    /* Category tag */
    .category-tag {
      font-size: 11.5px; padding: 2px 8px; border-radius: 5px;
      background: #a78bfa14; color: var(--allseason);
      border: 1px solid #a78bfa30; white-space: nowrap;
    }

    /* Channel indicators */
    .channel-indicators { display: flex; gap: 4px; align-items: center; }
    .ch-dot {
      display: inline-flex; align-items: center; justify-content: center;
      width: 26px; height: 26px; border-radius: 6px; font-size: 13px;
      transition: all 0.15s;
    }
    .ch-dot.on {
      background: #22c55e18; border: 1px solid #22c55e40;
      filter: none; opacity: 1;
    }
    .ch-dot.off {
      background: var(--bg-tertiary); border: 1px solid var(--border-subtle);
      filter: grayscale(1); opacity: 0.35;
    }

    /* Web status badges */
    .web-status-badge {
      display: inline-flex; align-items: center; gap: 3px;
      padding: 3px 8px; border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px; font-weight: 600; letter-spacing: 0.3px;
      white-space: nowrap;
    }
    .ws-active { background: #22c55e18; color: var(--success); border: 1px solid #22c55e30; }
    .ws-draft { background: #8b8b9418; color: var(--text-tertiary); border: 1px solid var(--border); }
    .ws-oos { background: #ef444418; color: var(--danger); border: 1px solid #ef444430; }
    .ws-archived { background: #8b8b9410; color: var(--text-tertiary); border: 1px solid var(--border-subtle); opacity: 0.6; }
    .ws-hidden { background: #f59e0b18; color: var(--warning); border: 1px solid #f59e0b30; }
    .ws-unknown { background: var(--bg-tertiary); color: var(--text-tertiary); border: 1px solid var(--border-subtle); }
    .tire-card-body { padding: 16px; }
    .tire-card-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; letter-spacing: -0.2px; }
    .tire-card-subtitle { font-size: 12px; color: var(--text-tertiary); margin-bottom: 12px; font-family: 'JetBrains Mono', monospace; }
    .tire-card-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; }
    .tire-meta-item { display: flex; flex-direction: column; }
    .tire-meta-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-tertiary); font-weight: 500; }
    .tire-meta-value { font-size: 12.5px; color: var(--text-secondary); font-weight: 500; margin-top: 1px; }
    .tire-meta-value.mono { font-family: 'JetBrains Mono', monospace; font-size: 12px; }

    /* Season badge */
    .season-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
    .season-badge.winter { background: #60a5fa20; color: var(--winter); }
    .season-badge.summer { background: #fb923c20; color: var(--summer); }
    .season-badge.all-season, .season-badge.allseason, .season-badge.all_season { background: #a78bfa20; color: var(--allseason); }

    /* Tread depth bar */
    .tread-bar { display: flex; align-items: center; gap: 8px; }
    .tread-bar-track { flex: 1; height: 6px; background: var(--bg-tertiary); border-radius: 3px; overflow: hidden; max-width: 80px; }
    .tread-bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
    .tread-bar-fill.good { background: var(--success); }
    .tread-bar-fill.fair { background: var(--warning); }
    .tread-bar-fill.low { background: var(--danger); }

    /* Condition badge */
    .condition-badge { display: inline-flex; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
    .condition-badge.excellent, .condition-badge.a { background: #22c55e18; color: var(--success); }
    .condition-badge.good, .condition-badge.b { background: #c8ff0018; color: var(--accent); }
    .condition-badge.fair, .condition-badge.c { background: #f59e0b18; color: var(--warning); }
    .condition-badge.poor, .condition-badge.d { background: #ef444418; color: var(--danger); }

    /* Detail modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 14px; max-width: 700px; width: 95%; max-height: 85vh; overflow-y: auto; }
    .modal-images { display: flex; gap: 2px; height: 260px; overflow: hidden; background: var(--bg-tertiary); }
    .modal-images img { flex: 1; object-fit: cover; min-width: 0; }
    .modal-body { padding: 24px; }
    .modal-title { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 4px; }
    .modal-subtitle { font-size: 13px; color: var(--text-tertiary); font-family: 'JetBrains Mono', monospace; margin-bottom: 20px; }
    .modal-meta-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .modal-meta-item { background: var(--bg-tertiary); border-radius: 8px; padding: 12px 14px; }
    .modal-meta-item .tire-meta-label { margin-bottom: 4px; }
    .modal-meta-item .tire-meta-value { font-size: 14px; }
    .modal-close { position: absolute; top: 16px; right: 16px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 8px; color: var(--text-secondary); width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; }
    .modal-close:hover { color: var(--text-primary); background: var(--bg-hover); }

    /* Table (for orders/customers/inventory) */
    .table-container { background: var(--bg-secondary); border: 1px solid var(--border-subtle); border-radius: 10px; overflow: hidden; }
    .table-header { padding: 14px 20px; border-bottom: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: space-between; }
    .table-header h3 { font-size: 13.5px; font-weight: 600; }
    .search-box { display: flex; align-items: center; gap: 6px; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; }
    .search-box input { background: transparent; border: none; outline: none; color: var(--text-primary); font-family: 'DM Sans', sans-serif; font-size: 12.5px; width: 180px; }
    .search-box input::placeholder { color: var(--text-tertiary); }
    .search-box svg { color: var(--text-tertiary); flex-shrink: 0; }
    table { width: 100%; border-collapse: collapse; }
    thead th { text-align: left; padding: 10px 20px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.7px; color: var(--text-tertiary); font-weight: 500; border-bottom: 1px solid var(--border-subtle); background: var(--bg-tertiary); }
    tbody tr { border-bottom: 1px solid var(--border-subtle); transition: background 0.1s; }
    tbody tr:hover { background: var(--bg-tertiary); }
    tbody tr:last-child { border-bottom: none; }
    tbody td { padding: 12px 20px; font-size: 13px; color: var(--text-secondary); }
    tbody td:first-child { color: var(--text-primary); font-weight: 500; }
    .mono { font-family: 'JetBrains Mono', monospace; font-size: 12px; }
    .status-badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 20px; font-size: 11.5px; font-weight: 500; }
    .status-badge.active, .status-badge.open, .status-badge.fulfilled, .status-badge.paid { background: #22c55e18; color: var(--success); }
    .status-badge.draft, .status-badge.closed, .status-badge.unfulfilled { background: #8b8b9418; color: var(--text-tertiary); }
    .status-badge.cancelled, .status-badge.refunded { background: #ef444418; color: var(--danger); }
    .status-badge.pending, .status-badge.authorized, .status-badge.partial { background: #f59e0b18; color: var(--warning); }

    /* Settings */
    .settings-panel { max-width: 560px; }
    .settings-group { background: var(--bg-secondary); border: 1px solid var(--border-subtle); border-radius: 10px; padding: 24px; margin-bottom: 16px; }
    .settings-group h3 { font-size: 14px; font-weight: 600; margin-bottom: 16px; }
    .field { margin-bottom: 14px; }
    .field:last-child { margin-bottom: 0; }
    .field label { display: block; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.7px; color: var(--text-tertiary); font-weight: 500; margin-bottom: 6px; }
    .field input { width: 100%; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 7px; padding: 9px 12px; color: var(--text-primary); font-family: 'JetBrains Mono', monospace; font-size: 12.5px; outline: none; transition: border-color 0.15s; }
    .field input:focus { border-color: var(--accent); }
    .field input::placeholder { color: var(--text-tertiary); }
    .field .hint { font-size: 11px; color: var(--text-tertiary); margin-top: 4px; }
    .connection-status { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-radius: 8px; font-size: 12.5px; font-weight: 500; margin-top: 16px; }
    .connection-status.connected { background: #22c55e14; color: var(--success); border: 1px solid #22c55e30; }
    .connection-status.disconnected { background: #ef444414; color: var(--danger); border: 1px solid #ef444430; }
    .connection-status.testing { background: #3b82f614; color: var(--info); border: 1px solid #3b82f630; }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-tertiary); }
    .empty-state p { font-size: 13px; }
    .loading-cell { text-align: center; padding: 40px !important; color: var(--text-tertiary); font-size: 13px; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.3s ease; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .pulse { animation: pulse 2s ease-in-out infinite; }

    @media (max-width: 900px) {
      .sidebar { width: 56px; }
      .sidebar-brand h1, .sidebar-brand .host, .nav-item span, .nav-badge { display: none; }
      .nav-item { justify-content: center; padding: 10px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .tire-grid { grid-template-columns: 1fr; }
      .modal-meta-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <h1>🛞 Tire Admin</h1>
        <div class="host" id="sidebar-host">not connected</div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
    </aside>
    <div class="main-content">
      <div class="topbar">
        <h2 id="page-title">Settings</h2>
        <div class="topbar-actions" id="topbar-actions"></div>
      </div>
      <div class="content-area" id="content"></div>
    </div>
  </div>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal" id="modal-content" style="position:relative">
      <div class="modal-close" onclick="closeModal()">✕</div>
    </div>
  </div>

  <script>
    // ── State ───────────────────────────────────────────────────────
    const state = {
      page: "settings",
      apiUrl: "",
      connected: false,
      products: [],
      _flatRows: [],
      studioCounts: {},
      filters: { search: "", brand: "", season: "", condition: "", size: "", webStatus: "", category: "" },
    };

    // Known metafield keys to look for (Shopify stores them with namespace.key)
    const TIRE_FIELDS = [
      { key: "brand", label: "Brand" },
      { key: "size", label: "Size" },
      { key: "width", label: "Width" },
      { key: "rim_diameter", label: "Rim" },
      { key: "season", label: "Season" },
      { key: "tread_depth", label: "Tread Depth" },
      { key: "condition", label: "Condition" },
      { key: "dot_date", label: "DOT Date" },
      { key: "load_index", label: "Load Index" },
      { key: "speed_rating", label: "Speed Rating" },
      { key: "price_per_tire", label: "Price/Tire" },
      { key: "quantity", label: "Qty" },
    ];

    const PAGES = [
      { id: "tires", label: "Tires", icon: "tire" },
      { id: "orders", label: "Orders", icon: "shopping-bag" },
      { id: "customers", label: "Customers", icon: "users" },
      { id: "inventory", label: "Inventory", icon: "box" },
      { id: "settings", label: "Settings", icon: "settings" },
    ];

    const ICONS = {
      "tire": `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="8"/><line x1="12" y1="16" x2="12" y2="22"/><line x1="2" y1="12" x2="8" y2="12"/><line x1="16" y1="12" x2="22" y2="12"/></svg>`,
      "shopping-bag": `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>`,
      "users": `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>`,

    // ── API ─────────────────────────────────────────────────────────
    async function apiFetch(endpoint) {
      const base = state.apiUrl ? state.apiUrl.replace(/\/$/, "") : "";
      const res = await fetch(base + endpoint);
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }

    // ── Metafield helpers ───────────────────────────────────────────
    function getMeta(product, fieldKey) {
      if (!product.metafields) return null;
      const mf = product.metafields.find(m =>
        m.key === fieldKey || m.key.endsWith("_" + fieldKey) ||
        m.key.replace(/-/g, "_").includes(fieldKey.replace(/-/g, "_"))
      );
      return mf ? mf.value : null;
    }

    function getMetaAll(product) {
      const result = {};
      for (const f of TIRE_FIELDS) {
        result[f.key] = getMeta(product, f.key);
      }
      // Also try from product title/vendor as fallback
      if (!result.brand && product.vendor) result.brand = product.vendor;
      return result;
    }

    // ── Rendering helpers ───────────────────────────────────────────
    function seasonBadge(season) {
      if (!season) return '<span class="tire-meta-value">—</span>';
      const s = season.toLowerCase().replace(/[\s-]/g, "");
      let cls = "all-season";
      if (s.includes("winter") || s.includes("hiver")) cls = "winter";
      else if (s.includes("summer") || s.includes("été") || s.includes("ete")) cls = "summer";
      const icons = { winter: "❄️", summer: "☀️", "all-season": "🔄" };
      return `<span class="season-badge ${cls}">${icons[cls] || "🔄"} ${season}</span>`;
    }

    function conditionBadge(cond) {
      if (!cond) return "—";
      const c = cond.toLowerCase().trim();
      let cls = "fair";
      if (c === "a" || c.includes("excellent") || c.includes("new")) cls = "excellent";
      else if (c === "b" || c.includes("good") || c.includes("bon")) cls = "good";
      else if (c === "c" || c.includes("fair") || c.includes("moyen")) cls = "fair";
      else if (c === "d" || c.includes("poor") || c.includes("mauvais")) cls = "poor";
      return `<span class="condition-badge ${cls}">${cond}</span>`;
    }

    function treadDepthBar(depth) {
      if (!depth) return "—";
      const num = parseFloat(depth);
      if (isNaN(num)) return depth;
      // Assume max tread ~10mm for used tires
      const pct = Math.min(100, (num / 10) * 100);
      let cls = "good";
      if (pct < 30) cls = "low";
      else if (pct < 60) cls = "fair";
      return `<div class="tread-bar">
        <div class="tread-bar-track"><div class="tread-bar-fill ${cls}" style="width:${pct}%"></div></div>
        <span class="mono" style="font-size:11px">${num}mm</span>
      </div>`;
    }

    function statCard(label, value, accent) {
      const v = value === null || value === undefined ? '<span class="pulse">—</span>' : value;
      return `<div class="stat-card"><div class="stat-label">${label}</div><div class="stat-value ${accent ? 'accent' : ''}">${v}</div></div>`;
    }

    function statusBadge(s) {
      return `<span class="status-badge ${(s||"unknown").toLowerCase().replace(/\s/g,"")}">${s||"unknown"}</span>`;
    }

    function money(val) {
      return "$" + parseFloat(val || 0).toLocaleString("en", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    // ── Navigation ──────────────────────────────────────────────────
    function navigate(pageId) {
      state.page = pageId;
      renderSidebar();
      renderTopbar();
      renderContent();
    }

    function renderSidebar() {
      const nav = document.getElementById("sidebar-nav");
      nav.innerHTML = PAGES.map(p => `
        <div class="nav-item ${state.page === p.id ? 'active' : ''}" onclick="navigate('${p.id}')">
          ${ICONS[p.icon]}
          <span>${p.label}</span>
          ${p.id === 'settings' && !state.connected ? '<span class="nav-badge nav-warn">!</span>' : ''}
        </div>
      `).join("");
      document.getElementById("sidebar-host").textContent =
        state.connected ? (state.apiUrl ? new URL(state.apiUrl).host : window.location.host) : "not connected";
    }

    function renderTopbar() {
      document.getElementById("page-title").textContent = PAGES.find(p => p.id === state.page)?.label || "";
      const actions = document.getElementById("topbar-actions");
      actions.innerHTML = state.page !== "settings"
        ? `<button class="btn" onclick="renderContent()">${ICONS.refresh} Refresh</button>`
        : "";
    }

    function renderContent() {
      const el = document.getElementById("content");
      if (!state.connected && state.page !== "settings") {
        el.innerHTML = `<div class="empty-state"><p>Connect your API first in <strong style="color:var(--accent);cursor:pointer" onclick="navigate('settings')">Settings</strong></p></div>`;
        return;
      }
      switch (state.page) {
        case "tires": return renderTires(el);
        case "orders": return renderOrders(el);
        case "customers": return renderCustomers(el);
        case "inventory": return renderInventory(el);
        case "settings": return renderSettings(el);
      }
    }

    // ── TIRES PAGE ──────────────────────────────────────────────────
    async function renderTires(el) {
      el.innerHTML = `<div class="stats-grid">${statCard("Loading...", null, true)}${statCard("",null)}${statCard("",null)}${statCard("",null)}</div>
        <div style="text-align:center;padding:60px;color:var(--text-tertiary)"><span class="pulse">Loading all products with metafields — this may take a moment...</span></div>`;

      try {
        const [pRes, cRes, studioRes] = await Promise.all([
          apiFetch("/api/products/with-metafields"),
          apiFetch("/api/products/count"),
          apiFetch("/api/studio/sku-counts").catch(() => ({ sku_counts: {} })),
        ]);
        state.products = (pRes.products || []).map(p => ({ ...p, _meta: getMetaAll(p) }));
        state.studioCounts = studioRes.sku_counts || {};
        const count = cRes.count ?? 0;

        // Extract unique values for filters
        const brands = [...new Set(state.products.map(p => p._meta.brand).filter(Boolean))].sort();
        const seasons = [...new Set(state.products.map(p => p._meta.season).filter(Boolean))].sort();
        const conditions = [...new Set(state.products.map(p => p._meta.condition).filter(Boolean))].sort();
        const sizes = [...new Set(state.products.map(p => p._meta.size).filter(Boolean))].sort();
        const categories = [...new Set(state.products.map(p => p.taxonomy_category).filter(Boolean))].sort();

        const avgTread = state.products.reduce((s, p) => {
          const d = parseFloat(p._meta.tread_depth);
          return isNaN(d) ? s : { sum: s.sum + d, n: s.n + 1 };
        }, { sum: 0, n: 0 });

        const totalSkus = state.products.reduce((s, p) => s + (p.variants?.length || 1), 0);
        const active = state.products.filter(p => p.status === "active" && p.published_at).length;
        const drafts = state.products.filter(p => p.status === "draft").length;
        const oos = state.products.filter(p => {
          if (p.status !== "active" || !p.published_at) return false;
          const totalQty = (p.variants || []).reduce((s, v) => s + (parseInt(v.inventory_quantity) || 0), 0);
          return totalQty <= 0;
        }).length;

        // Studio stats
        const studioSkus = Object.keys(state.studioCounts).length;
        const studioTotal = Object.values(state.studioCounts).reduce((s, c) => s + c.total, 0);

        el.innerHTML = `
          <div class="stats-grid fade-in" style="grid-template-columns:repeat(5,1fr)">
            ${statCard("Total SKUs", totalSkus, true)}
            ${statCard("🟢 Active", active)}
            ${statCard("📝 Draft", drafts)}
            ${statCard("🔴 Out of Stock", oos)}
            ${statCard("📷 Studio Pics", studioTotal + " (" + studioSkus + " SKUs)")}
          </div>

          <div class="filters-bar fade-in">
            <div class="filter-group">
              <label>Search</label>
              <input class="filter-input" placeholder="Title, SKU, category..." oninput="state.filters.search=this.value;renderTireGrid()" />
            </div>
            <div class="filter-group">
              <label>Status</label>
              <select class="filter-select" onchange="state.filters.webStatus=this.value;renderTireGrid()">
                <option value="">All Status</option>
                <option value="active">🟢 Active</option>
                <option value="draft">📝 Draft</option>
                <option value="oos">🔴 Out of Stock</option>
                <option value="hidden">🟡 Hidden</option>
                <option value="archived">⚫ Archived</option>
              </select>
            </div>
            <div class="filter-group">
              <label>Category</label>
              <select class="filter-select" onchange="state.filters.category=this.value;renderTireGrid()">
                <option value="">All Categories</option>
                ${categories.map(c => `<option value="${c}">${c}</option>`).join("")}
              </select>
            </div>
            <div class="filter-group">
              <label>Brand</label>
              <select class="filter-select" onchange="state.filters.brand=this.value;renderTireGrid()">
                <option value="">All Brands</option>
                ${brands.map(b => `<option value="${b}">${b}</option>`).join("")}
              </select>
            </div>
            <div class="filter-group">
              <label>Season</label>
              <select class="filter-select" onchange="state.filters.season=this.value;renderTireGrid()">
                <option value="">All Seasons</option>
                ${seasons.map(s => `<option value="${s}">${s}</option>`).join("")}
              </select>
            </div>
            <div class="filter-group">
              <label>Condition</label>
              <select class="filter-select" onchange="state.filters.condition=this.value;renderTireGrid()">
                <option value="">All Conditions</option>
                ${conditions.map(c => `<option value="${c}">${c}</option>`).join("")}
              </select>
            </div>
            <div class="filter-group">
              <label>Size</label>
              <select class="filter-select" onchange="state.filters.size=this.value;renderTireGrid()">
                <option value="">All Sizes</option>
                ${sizes.map(s => `<option value="${s}">${s}</option>`).join("")}
              </select>
            </div>
            <div class="filter-group">
              <button class="btn filter-reset" onclick="resetFilters()">Reset</button>
            </div>
          </div>

          <div id="tire-grid-container" class="fade-in"></div>`;

        renderTireGrid();
      } catch (e) {
        el.innerHTML = `<div class="empty-state"><p>Error: ${e.message}</p></div>`;
      }
    }

    function getWebStatus(product, qty) {
      const status = product.status;
      const published = !!product.published_at;
      if (status === "draft") return { cls: "ws-draft", label: "Draft", title: "Draft — not visible on website" };
      if (status === "archived") return { cls: "ws-archived", label: "Archived", title: "Archived — removed from website" };
      if (status === "active" && published && qty <= 0) return { cls: "ws-oos", label: "OOS", title: "Active but Out of Stock" };
      if (status === "active" && published) return { cls: "ws-active", label: "Active", title: "Live on website" };
      if (status === "active" && !published) return { cls: "ws-hidden", label: "Hidden", title: "Active but not published to website" };
      return { cls: "ws-unknown", label: "?", title: "Unknown status" };
    }

    function renderTireGrid() {
      const container = document.getElementById("tire-grid-container");
      if (!container) return;

      const f = state.filters;

      // Flatten: one row per variant (SKU)
      const rows = [];
      state.products.forEach((p, pIdx) => {
        const m = p._meta;
        const variants = p.variants && p.variants.length > 0 ? p.variants : [{}];
        variants.forEach(v => {
          const sku = v.sku || "—";
          if (f.search) {
            const q = f.search.toLowerCase();
            const searchable = `${p.title} ${m.brand} ${m.size} ${m.season} ${m.width} ${sku} ${p.taxonomy_category || ""}`.toLowerCase();
            if (!searchable.includes(q)) return;
          }
          if (f.brand && m.brand !== f.brand) return;
          if (f.season && m.season !== f.season) return;
          if (f.condition && m.condition !== f.condition) return;
          if (f.size && m.size !== f.size) return;
          if (f.category && p.taxonomy_category !== f.category) return;
          if (f.webStatus) {
            const ws = getWebStatus(p, parseInt(m.quantity || v.inventory_quantity || 0));
            const wsKey = ws.cls.replace("ws-", "");
            if (wsKey !== f.webStatus) return;
          }
          rows.push({ product: p, variant: v, meta: m, pIdx });
        });
      });

      if (rows.length === 0) {
        container.innerHTML = `<div class="empty-state"><p>No tires match your filters</p></div>`;
        return;
      }

      container.innerHTML = `
        <div style="margin-bottom:12px;font-size:12px;color:var(--text-tertiary)">${rows.length} SKU${rows.length !== 1 ? 's' : ''} found</div>
        <div class="table-container" style="overflow-x:auto">
          <table>
            <thead><tr>
              <th style="width:52px"></th>
              <th>SKU</th>
              <th>Title</th>
              <th>Category</th>
              <th>📷 Shop</th>
              <th>📷 Studio</th>
              <th>Channels</th>
              <th>Brand</th>
              <th>Size</th>
              <th>Season</th>
              <th>Condition</th>
              <th>Tread</th>
              <th>DOT</th>
              <th>Price</th>
              <th>Qty</th>
            </tr></thead>
            <tbody>
              ${rows.map((r, i) => {
                const img = (r.product.images || [])[0];
                const imgCount = (r.product.images || []).length;
                const sku = r.variant.sku || "—";
                const price = r.variant.price || r.meta.price_per_tire;
                const qty = parseInt(r.meta.quantity || r.variant.inventory_quantity || 0);
                const webStatus = getWebStatus(r.product, qty);
                const studio = sku !== "—" ? (state.studioCounts[sku] || null) : null;
                const studioTotal = studio ? studio.total : 0;
                const studioCompleted = studio ? studio.completed : 0;
                const studioPending = studio ? (studio.pending + studio.processing + studio.draft) : 0;
                const isOnEbay = false; // future
                const isOnAmazon = false; // future
                const isOnMarketplace = false; // future
                return `<tr class="tire-row" onclick="openModal(${i})" style="cursor:pointer">
                  <td style="padding:6px 10px 6px 14px">
                    ${img ? `<img src="${img.src}" class="row-thumb" alt="" />` : `<div class="row-thumb-empty">—</div>`}
                  </td>
                  <td><span class="sku-tag">${sku}</span></td>
                  <td style="color:var(--text-primary);font-weight:500">${r.product.title}</td>
                  <td><span class="category-tag" title="${r.product.taxonomy_full || ''}">${r.product.taxonomy_category || "—"}</span></td>
                  <td><span class="pic-count ${imgCount >= 3 ? 'good' : imgCount > 0 ? 'low' : 'none'}">${imgCount}</span></td>
                  <td>${studioTotal > 0
                    ? `<span class="studio-count" title="${studioCompleted} done, ${studioPending} pending">${studioCompleted}✅${studioPending > 0 ? ` ${studioPending}⏳` : ''}</span>`
                    : '<span class="studio-count empty">0</span>'}</td>
                  <td>
                    <div class="channel-indicators">
                      <span class="web-status-badge ${webStatus.cls}" title="${webStatus.title}">🌐 ${webStatus.label}</span>
                      <span class="ch-dot ${isOnEbay ? 'on' : 'off'}" title="eBay">🏷️</span>
                      <span class="ch-dot ${isOnAmazon ? 'on' : 'off'}" title="Amazon">📦</span>
                      <span class="ch-dot ${isOnMarketplace ? 'on' : 'off'}" title="Marketplace">🏪</span>
                    </div>
                  </td>
                  <td>${r.meta.brand || "—"}</td>
                  <td class="mono">${r.meta.size || "—"}</td>
                  <td>${seasonBadge(r.meta.season)}</td>
                  <td>${conditionBadge(r.meta.condition)}</td>
                  <td>${treadDepthBar(r.meta.tread_depth)}</td>
                  <td class="mono">${r.meta.dot_date || "—"}</td>
                  <td class="mono">${price ? money(price) : "—"}</td>
                  <td class="mono">${r.meta.quantity || r.variant.inventory_quantity || "—"}</td>
                </tr>`;
              }).join("")}
            </tbody>
          </table>
        </div>`;

      // Store flattened rows for modal
      state._flatRows = rows;
    }

    function tireCard() { /* replaced by table rows */ }

    function resetFilters() {
      state.filters = { search: "", brand: "", season: "", condition: "", size: "", webStatus: "", category: "" };
      document.querySelectorAll(".filter-select").forEach(s => s.value = "");
      document.querySelectorAll(".filter-input").forEach(i => i.value = "");
      renderTireGrid();
    }

    // ── Detail Modal ────────────────────────────────────────────────

        ? images.map(img => `<img src="${img.src}" alt="${p.title}" />`).join("")
        : `<div class="no-img" style="height:260px;display:flex;align-items:center;justify-content:center;color:var(--text-tertiary)">No images</div>`;

      const studioTotal = studio ? studio.total : 0;
      const studioCompleted = studio ? studio.completed : 0;

            <div class="modal-title">${p.title}</div>
            <span class="sku-tag" style="font-size:12px;padding:3px 10px">${sku}</span>
          </div>
          <div class="modal-subtitle">SKU: ${sku} · ${m.size || ""} ${m.brand ? "· " + m.brand : ""} ${price ? "· " + money(price) : ""} ${p.taxonomy_category ? "· " + p.taxonomy_category : ""}</div>

          <div style="display:flex;gap:16px;margin:16px 0;padding:14px 16px;background:var(--bg-tertiary);border-radius:8px;border:1px solid var(--border-subtle);flex-wrap:wrap">

              ${studioTotal > 0
                ? `<span class="studio-count" style="font-size:13px;padding:3px 10px">${studioCompleted}✅ done${studioPending > 0 ? `, ${studioPending}⏳ pending` : ''}</span>`
                : `<span class="studio-count empty" style="font-size:13px;padding:3px 10px">No images</span>`}
            </div>
            <div style="width:1px;background:var(--border-subtle)"></div>
            <div style="display:flex;align-items:center;gap:8px">
              <span style="font-size:11px;text-transform:uppercase;letter-spacing:0.6px;color:var(--text-tertiary);font-weight:500">Channels</span>
              <div class="channel-indicators" style="gap:6px">
                <span class="web-status-badge ${webStatus.cls}" style="font-size:12px;padding:4px 10px" title="${webStatus.title}">🌐 ${webStatus.label}</span>
                <span class="ch-dot off" title="eBay" style="width:30px;height:30px;font-size:15px">🏷️</span>
                <span class="ch-dot off" title="Amazon" style="width:30px;height:30px;font-size:15px">📦</span>
                <span class="ch-dot off" title="Marketplace" style="width:30px;height:30px;font-size:15px">🏪</span>
              </div>
            </div>
          </div>

          <div class="modal-meta-grid">
            <div class="modal-meta-item">
              <span class="tire-meta-label">SKU</span>
              <span class="tire-meta-value mono" style="font-size:14px;color:var(--accent)">${sku}</span>
            </div>
            <div class="modal-meta-item">
              <span class="tire-meta-label">Category</span>
              <span class="tire-meta-value"><span class="category-tag" title="${p.taxonomy_full || ''}">${p.taxonomy_category || "—"}</span></span>
            </div>
            ${p.taxonomy_full ? `<div class="modal-meta-item" style="grid-column:span 2">
              <span class="tire-meta-label">Full Path</span>
              <span class="tire-meta-value" style="font-size:12px;color:var(--text-tertiary)">${p.taxonomy_full}</span>
            </div>` : ""}
            ${TIRE_FIELDS.map(f => `
              <div class="modal-meta-item">
                <span class="tire-meta-label">${f.label}</span>
                <span class="tire-meta-value${['dot_date','load_index','speed_rating','width','rim_diameter','quantity'].includes(f.key) ? ' mono' : ''}">
                  ${f.key === 'season' ? seasonBadge(m[f.key]) :
                    f.key === 'condition' ? conditionBadge(m[f.key]) :
                    f.key === 'tread_depth' ? treadDepthBar(m[f.key]) :
                    f.key === 'price_per_tire' ? (m[f.key] ? money(m[f.key]) : price ? money(price) : "—") :
                    f.key === 'quantity' ? (m[f.key] || v.inventory_quantity || "—") :
                    m[f.key] || "—"}
                </span>
              </div>
            `).join("")}
          </div>
          ${p.body_html ? `<div style="margin-top:20px;font-size:13px;color:var(--text-secondary);line-height:1.6;border-top:1px solid var(--border-subtle);padding-top:16px">${p.body_html}</div>` : ""}
        </div>`;

      document.getElementById("modal-overlay").classList.add("open");
    }

    function closeModal() {
      document.getElementById("modal-overlay").classList.remove("open");
    }
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

    // ── Orders / Customers / Inventory (unchanged) ──────────────────
    async function renderOrders(el) {
      el.innerHTML = `<div class="stats-grid">${statCard("Loading...", null, true)}</div><div class="table-container"><table><tbody><tr><td colspan="6" class="loading-cell"><span class="pulse">Loading orders...</span></td></tr></tbody></table></div>`;
      try {
        const [oRes, cRes] = await Promise.all([apiFetch("/api/orders?limit=50&status=any"), apiFetch("/api/orders/count")]);
        const orders = oRes.orders || []; const count = cRes.count ?? 0;
        const paid = orders.filter(o => o.financial_status === "paid").length;
        const revenue = orders.reduce((s, o) => s + parseFloat(o.total_price || 0), 0);
        el.innerHTML = `
          <div class="stats-grid fade-in">${statCard("Total Orders", count, true)}${statCard("Paid", paid)}${statCard("Revenue", money(revenue))}${statCard("Avg. Order", orders.length ? money(revenue / orders.length) : "—")}</div>
          <div class="table-container fade-in"><div class="table-header"><h3>Recent Orders</h3></div>
          <table><thead><tr><th>Order</th><th>SKUs</th><th>Customer</th><th>Fulfillment</th><th>Payment</th><th>Total</th><th>Date</th></tr></thead>
          <tbody>${orders.length === 0 ? '<tr><td colspan="7" class="loading-cell">No orders</td></tr>' :
            orders.map(o => {
              const skus = (o.line_items || []).map(li => li.sku).filter(Boolean).join(", ") || "—";
              return `<tr><td class="mono">${o.name}</td><td class="mono" style="color:var(--accent)">${skus}</td><td>${o.customer ? (o.customer.first_name||"")+" "+(o.customer.last_name||"") : o.email||"—"}</td><td>${statusBadge(o.fulfillment_status||"unfulfilled")}</td><td>${statusBadge(o.financial_status)}</td><td class="mono">${money(o.total_price)}</td><td>${new Date(o.created_at).toLocaleDateString()}</td></tr>`;
            }).join("")}
          </tbody></table></div>`;
      } catch (e) { el.innerHTML = `<div class="empty-state"><p>Error: ${e.message}</p></div>`; }
    }

    async function renderCustomers(el) {
      el.innerHTML = `<div class="stats-grid">${statCard("Loading...", null, true)}</div><div class="table-container"><table><tbody><tr><td colspan="5" class="loading-cell"><span class="pulse">Loading...</span></td></tr></tbody></table></div>`;
      try {
        const [cRes, countRes] = await Promise.all([apiFetch("/api/customers?limit=50"), apiFetch("/api/customers/count")]);
        const customers = cRes.customers || []; const count = countRes.count ?? 0;
        const totalSpent = customers.reduce((s, c) => s + parseFloat(c.total_spent || 0), 0);
        el.innerHTML = `
          <div class="stats-grid fade-in">${statCard("Total Customers", count, true)}${statCard("With Orders", customers.filter(c => c.orders_count > 0).length)}${statCard("Total Spent", money(totalSpent))}${statCard("Avg. Spent", customers.length ? money(totalSpent / customers.length) : "—")}</div>
          <div class="table-container fade-in"><div class="table-header"><h3>Customers</h3></div>
          <table><thead><tr><th>Name</th><th>Email</th><th>Orders</th><th>Total Spent</th><th>Location</th></tr></thead>
          <tbody>${customers.map(c => `<tr><td>${((c.first_name||"")+" "+(c.last_name||"")).trim()||"—"}</td><td>${c.email||"—"}</td><td class="mono">${c.orders_count||0}</td><td class="mono">${money(c.total_spent)}</td><td>${c.default_address ? (c.default_address.city||"")+", "+(c.default_address.country||"") : "—"}</td></tr>`).join("")}
          </tbody></table></div>`;
      } catch (e) { el.innerHTML = `<div class="empty-state"><p>Error: ${e.message}</p></div>`; }
    }

    async function renderInventory(el) {
      el.innerHTML = `<div class="table-container"><table><tbody><tr><td colspan="5" class="loading-cell"><span class="pulse">Loading...</span></td></tr></tbody></table></div>`;
      try {
        const res = await apiFetch("/api/inventory/locations");
        const locations = res.locations || [];
        el.innerHTML = `
          <div class="stats-grid fade-in">${statCard("Locations", locations.length, true)}${statCard("Active", locations.filter(l => l.active).length)}</div>
          <div class="table-container fade-in"><div class="table-header"><h3>Inventory Locations</h3></div>
          <table><thead><tr><th>Location</th><th>Address</th><th>City</th><th>Country</th><th>Active</th></tr></thead>
          <tbody>${locations.map(l => `<tr><td>${l.name}</td><td>${l.address1||"—"}</td><td>${l.city||"—"}</td><td>${l.country_name||l.country||"—"}</td><td style="color:${l.active?'var(--success)':'var(--text-tertiary)'}">${l.active?'✓ Yes':'No'}</td></tr>`).join("")}
          </tbody></table></div>`;
      } catch (e) { el.innerHTML = `<div class="empty-state"><p>Error: ${e.message}</p></div>`; }
    }

    // ── Settings ────────────────────────────────────────────────────
    function renderSettings(el) {
      el.innerHTML = `
        <div class="settings-panel fade-in">
          <div class="settings-group">
            <h3>API Connection</h3>
            <div class="field">
              <label>API Base URL</label>
              <input id="api-url-input" value="${state.apiUrl}" placeholder="https://shopify-publisher-production.up.railway.app" />
              <div class="hint">Leave empty to auto-detect (same origin)</div>
            </div>
            <div style="display:flex;gap:8px;margin-top:16px">
              <button class="btn btn-accent" onclick="testConnection()">Test Connection</button>
              <button class="btn" onclick="saveApiUrl()">Save</button>
            </div>
            <div id="connection-status"></div>
          </div>
          <div class="settings-group">
            <h3>Metafield Mapping</h3>
            <p style="font-size:13px;color:var(--text-secondary);line-height:1.6">
              The dashboard looks for these metafield keys on your products:<br>
              <code style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);background:var(--bg-tertiary);padding:2px 6px;border-radius:4px;display:inline-block;margin-top:8px">
                ${TIRE_FIELDS.map(f => f.key).join(", ")}
              </code><br><br>
              Make sure your Shopify metafield keys match (namespace doesn't matter). The dashboard will fuzzy-match keys containing these terms.
            </p>
          </div>
        </div>`;
    }

    async function testConnection() {
      const url = document.getElementById("api-url-input").value.replace(/\/$/, "");
      const s = document.getElementById("connection-status");
      s.innerHTML = `<div class="connection-status testing"><span class="pulse">Testing...</span></div>`;
      try {
        const res = await fetch(url + "/health");
        if (res.ok) { state.apiUrl = url; state.connected = true; document.getElementById("sidebar-host").textContent = url ? new URL(url).host : window.location.host; s.innerHTML = `<div class="connection-status connected">${ICONS.check} Connected</div>`; }
        else s.innerHTML = `<div class="connection-status disconnected">${ICONS.alert} Failed (HTTP ${res.status})</div>`;
      } catch (e) { s.innerHTML = `<div class="connection-status disconnected">${ICONS.alert} Failed — check URL</div>`; }
    }

    function saveApiUrl() {
      state.apiUrl = document.getElementById("api-url-input").value.replace(/\/$/, "");
      state.connected = true;
      document.getElementById("sidebar-host").textContent = state.apiUrl ? new URL(state.apiUrl).host : window.location.host;
      navigate("tires");
    }

    // ── Auto-detect ─────────────────────────────────────────────────
    async function autoDetect() {
      try {
        const res = await fetch("/health");
        if (res.ok) {
          state.apiUrl = "";
          state.connected = true;
          document.getElementById("sidebar-host").textContent = window.location.host;
          navigate("tires");
          return;
        }
      } catch (e) {}
      navigate("settings");
    }
    autoDetect();
  </script>
</body>
</html>
