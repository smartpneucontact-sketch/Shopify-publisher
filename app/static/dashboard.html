<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tire Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-primary: #0a0a0b;
      --bg-secondary: #111113;
      --bg-tertiary: #18181b;
      --bg-elevated: #1e1e22;
      --bg-hover: #252529;
      --border: #2a2a2e;
      --border-subtle: #222225;
      --text-primary: #f0f0f2;
      --text-secondary: #8b8b94;
      --text-tertiary: #5a5a63;
      --accent: #c8ff00;
      --accent-dim: #c8ff0018;
      --accent-mid: #c8ff0040;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --info: #3b82f6;
      --winter: #60a5fa;
      --summer: #fb923c;
      --allseason: #a78bfa;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg-primary); color: var(--text-primary); -webkit-font-smoothing: antialiased; }
    .dashboard { display: flex; height: 100vh; overflow: hidden; }

    /* Sidebar */
    .sidebar { width: 240px; background: var(--bg-secondary); border-right: 1px solid var(--border-subtle); display: flex; flex-direction: column; flex-shrink: 0; }
    .sidebar-brand { padding: 24px 20px 20px; border-bottom: 1px solid var(--border-subtle); }
    .sidebar-brand h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; }
    .sidebar-brand .host { font-size: 11px; color: var(--text-tertiary); font-family: 'JetBrains Mono', monospace; margin-top: 4px; }
    .sidebar-nav { padding: 12px 10px; flex: 1; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 13.5px; color: var(--text-secondary); transition: all 0.15s ease; margin-bottom: 2px; border: 1px solid transparent; }
    .nav-item:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .nav-item.active { background: var(--accent-dim); color: var(--accent); font-weight: 500; border-color: var(--accent-mid); }
    .nav-item.active svg { stroke: var(--accent); }
    .nav-badge { margin-left: auto; background: var(--bg-elevated); color: var(--text-tertiary); font-size: 11px; font-family: 'JetBrains Mono', monospace; padding: 2px 7px; border-radius: 4px; }
    .nav-item.active .nav-badge { background: var(--accent-mid); color: var(--accent); }
    .nav-warn { background: #ef444430 !important; color: var(--danger) !important; }

    /* Main */
    .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .topbar { padding: 18px 28px; border-bottom: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: space-between; background: var(--bg-secondary); }
    .topbar h2 { font-size: 18px; font-weight: 600; letter-spacing: -0.4px; }
    .topbar-actions { display: flex; gap: 8px; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 7px; border: 1px solid var(--border); background: var(--bg-tertiary); color: var(--text-secondary); font-size: 12.5px; font-family: 'DM Sans', sans-serif; font-weight: 500; cursor: pointer; transition: all 0.15s ease; }
    .btn:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--text-tertiary); }
    .btn-accent { background: var(--accent); color: #0a0a0b; border-color: var(--accent); }
    .btn-accent:hover { background: #b8ee00; color: #0a0a0b; }
    .content-area { flex: 1; overflow-y: auto; padding: 24px 28px; }

    /* Stats */
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
    .stat-card { background: var(--bg-secondary); border: 1px solid var(--border-subtle); border-radius: 10px; padding: 18px 20px; transition: border-color 0.2s; }
    .stat-card:hover { border-color: var(--border); }
    .stat-label { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-tertiary); font-weight: 500; margin-bottom: 8px; }
    .stat-value { font-size: 28px; font-weight: 700; letter-spacing: -1px; font-family: 'JetBrains Mono', monospace; }
    .stat-value.accent { color: var(--accent); }

    /* Filters Bar */
    .filters-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
    .filter-group { display: flex; flex-direction: column; gap: 4px; }
    .filter-group label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-tertiary); font-weight: 500; }
    .filter-select, .filter-input {
      background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 7px;
      padding: 7px 10px; color: var(--text-primary); font-family: 'DM Sans', sans-serif;
      font-size: 12.5px; outline: none; transition: border-color 0.15s; min-width: 130px;
    }
    .filter-select:focus, .filter-input:focus { border-color: var(--accent); }
    .filter-select option { background: var(--bg-tertiary); }
    .filter-input::placeholder { color: var(--text-tertiary); }
    .filter-reset { margin-top: 16px; }

    /* Tire Cards */
    .tire-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
    .tire-card { background: var(--bg-secondary); border: 1px solid var(--border-subtle); border-radius: 12px; overflow: hidden; transition: border-color 0.2s, transform 0.2s; cursor: pointer; }
    .tire-card:hover { border-color: var(--border); transform: translateY(-2px); }
    .tire-card-images { display: flex; gap: 2px; height: 180px; overflow: hidden; background: var(--bg-tertiary); position: relative; }
    .tire-card-images img { flex: 1; object-fit: cover; min-width: 0; transition: opacity 0.2s; }
    .tire-card-images img:hover { opacity: 0.85; }
    .tire-card-images .no-img { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-tertiary); font-size: 12px; }
    .sku-overlay {
      position: absolute; top: 8px; left: 8px;
      background: rgba(0,0,0,0.75); backdrop-filter: blur(4px);
      color: var(--accent); font-family: 'JetBrains Mono', monospace;
      font-size: 11px; font-weight: 500; padding: 3px 8px;
      border-radius: 5px; letter-spacing: 0.3px; z-index: 2;
    }
    .sku-tag {
      flex-shrink: 0;
      background: var(--accent-dim); color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px; font-weight: 500; padding: 2px 6px;
      border-radius: 4px; border: 1px solid var(--accent-mid);
      letter-spacing: 0.2px; white-space: nowrap;
    }
    .row-thumb {
      width: 34px; height: 34px; border-radius: 4px; object-fit: cover;
      border: 1px solid var(--border-subtle);
    }
    .row-thumb-empty {
      width: 34px; height: 34px; border-radius: 4px;
      background: var(--bg-tertiary); border: 1px solid var(--border-subtle);
      display: flex; align-items: center; justify-content: center;
      color: var(--text-tertiary); font-size: 10px;
    }
    .tire-row:hover .sku-tag { background: var(--accent-mid); }

    /* Pic count */
    .pic-count {
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      padding: 1px 5px; border-radius: 4px; white-space: nowrap;
    }
    .pic-count.good { background: #22c55e14; color: var(--success); }
    .pic-count.low { background: #f59e0b14; color: var(--warning); }
    .pic-count.none { background: #ef444414; color: var(--danger); }

    /* Studio pic counts */
    .studio-count {
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      padding: 1px 5px; border-radius: 4px; white-space: nowrap;
      background: #3b82f614; color: var(--info);
    }
    .studio-count.empty { background: var(--bg-tertiary); color: var(--text-tertiary); }

    /* Category tag */
    .category-tag {
      font-size: 10px; padding: 1px 6px; border-radius: 4px;
      background: #a78bfa14; color: var(--allseason);
      border: 1px solid #a78bfa30; white-space: nowrap;
    }

    /* Channel indicators */
    .channel-indicators { display: flex; gap: 2px; align-items: center; }
    .ch-dot {
      display: inline-flex; align-items: center; justify-content: center;
      width: 20px; height: 20px; border-radius: 4px; font-size: 10px;
      transition: all 0.15s;
    }
    .ch-dot.on {
      background: #22c55e18; border: 1px solid #22c55e40;
      filter: none; opacity: 1;
    }
    .ch-dot.off {
      background: var(--bg-tertiary); border: 1px solid var(--border-subtle);
      filter: grayscale(1); opacity: 0.35;
    }

    /* Web status badges */
    .web-status-badge {
      display: inline-flex; align-items: center; gap: 2px;
      padding: 2px 5px; border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px; font-weight: 600; letter-spacing: 0.2px;
      white-space: nowrap;
    }
    .ws-active { background: #22c55e18; color: var(--success); border: 1px solid #22c55e30; }
    .ws-draft { background: #8b8b9418; color: var(--text-tertiary); border: 1px solid var(--border); }
    .ws-oos { background: #ef444418; color: var(--danger); border: 1px solid #ef444430; }
    .ws-archived { background: #8b8b9410; color: var(--text-tertiary); border: 1px solid var(--border-subtle); opacity: 0.6; }
    .ws-hidden { background: #f59e0b18; color: var(--warning); border: 1px solid #f59e0b30; }
    .ws-unknown { background: var(--bg-tertiary); color: var(--text-tertiary); border: 1px solid var(--border-subtle); }
    .tire-card-body { padding: 16px; }
    .tire-card-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; letter-spacing: -0.2px; }
    .tire-card-subtitle { font-size: 12px; color: var(--text-tertiary); margin-bottom: 12px; font-family: 'JetBrains Mono', monospace; }
    .tire-card-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; }
    .tire-meta-item { display: flex; flex-direction: column; }
    .tire-meta-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-tertiary); font-weight: 500; }
    .tire-meta-value { font-size: 12.5px; color: var(--text-secondary); font-weight: 500; margin-top: 1px; }
    .tire-meta-value.mono { font-family: 'JetBrains Mono', monospace; font-size: 12px; }

    /* Season badge */
    .season-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
    .season-badge.winter { background: #60a5fa20; color: var(--winter); }
    .season-badge.summer { background: #fb923c20; color: var(--summer); }
    .season-badge.all-season, .season-badge.allseason, .season-badge.all_season { background: #a78bfa20; color: var(--allseason); }

    /* Tread depth bar */
    .tread-bar { display: flex; align-items: center; gap: 4px; }
    .tread-bar-track { flex: 1; height: 4px; background: var(--bg-tertiary); border-radius: 2px; overflow: hidden; max-width: 40px; }
    .tread-bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
    .tread-bar-fill.good { background: var(--success); }
    .tread-bar-fill.fair { background: var(--warning); }
    .tread-bar-fill.low { background: var(--danger); }

    /* Condition badge */
    .condition-badge { display: inline-flex; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
    .condition-badge.excellent, .condition-badge.a { background: #22c55e18; color: var(--success); }
    .condition-badge.good, .condition-badge.b { background: #c8ff0018; color: var(--accent); }
    .condition-badge.fair, .condition-badge.c { background: #f59e0b18; color: var(--warning); }
    .condition-badge.poor, .condition-badge.d { background: #ef444418; color: var(--danger); }

    /* Detail modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 14px; max-width: 700px; width: 95%; max-height: 85vh; overflow-y: auto; }
    .modal-images { display: flex; gap: 2px; height: 260px; overflow: hidden; background: var(--bg-tertiary); }
    .modal-images img { flex: 1; object-fit: cover; min-width: 0; }
    .modal-body { padding: 24px; }
    .modal-title { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 4px; }
    .modal-subtitle { font-size: 13px; color: var(--text-tertiary); font-family: 'JetBrains Mono', monospace; margin-bottom: 20px; }
    .modal-meta-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .modal-meta-item { background: var(--bg-tertiary); border-radius: 8px; padding: 12px 14px; }
    .modal-meta-item .tire-meta-label { margin-bottom: 4px; }
    .modal-meta-item .tire-meta-value { font-size: 14px; }
    .modal-close { position: absolute; top: 16px; right: 16px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 8px; color: var(--text-secondary); width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; }
    .modal-close:hover { color: var(--text-primary); background: var(--bg-hover); }

    /* Table (for orders/customers/inventory) */
    .table-container { background: var(--bg-secondary); border: 1px solid var(--border-subtle); border-radius: 10px; overflow: hidden; }
    .table-header { padding: 14px 20px; border-bottom: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: space-between; }
    .table-header h3 { font-size: 13.5px; font-weight: 600; }
    .search-box { display: flex; align-items: center; gap: 6px; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; }
    .search-box input { background: transparent; border: none; outline: none; color: var(--text-primary); font-family: 'DM Sans', sans-serif; font-size: 12.5px; width: 180px; }
    .search-box input::placeholder { color: var(--text-tertiary); }
    .search-box svg { color: var(--text-tertiary); flex-shrink: 0; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    thead th { text-align: left; padding: 8px 6px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.7px; color: var(--text-tertiary); font-weight: 500; border-bottom: 1px solid var(--border-subtle); background: var(--bg-tertiary); white-space: nowrap; overflow: hidden; }
    tbody tr { border-bottom: 1px solid var(--border-subtle); transition: background 0.1s; }
    tbody tr:hover { background: var(--bg-tertiary); }
    tbody tr:last-child { border-bottom: none; }
    tbody td { padding: 14px 6px; font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    tbody td:first-child { color: var(--text-primary); font-weight: 500; }
    .mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    .status-badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 20px; font-size: 11.5px; font-weight: 500; }
    .status-badge.active, .status-badge.open, .status-badge.fulfilled, .status-badge.paid { background: #22c55e18; color: var(--success); }
    .status-badge.draft, .status-badge.closed, .status-badge.unfulfilled { background: #8b8b9418; color: var(--text-tertiary); }
    .status-badge.cancelled, .status-badge.refunded { background: #ef444418; color: var(--danger); }
    .status-badge.pending, .status-badge.authorized, .status-badge.partial { background: #f59e0b18; color: var(--warning); }

    /* Settings */
    .settings-panel { max-width: 560px; }
    .settings-group { background: var(--bg-secondary); border: 1px solid var(--border-subtle); border-radius: 10px; padding: 24px; margin-bottom: 16px; }
    .settings-group h3 { font-size: 14px; font-weight: 600; margin-bottom: 16px; }
    .field { margin-bottom: 14px; }
    .field:last-child { margin-bottom: 0; }
    .field label { display: block; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.7px; color: var(--text-tertiary); font-weight: 500; margin-bottom: 6px; }
    .field input { width: 100%; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 7px; padding: 9px 12px; color: var(--text-primary); font-family: 'JetBrains Mono', monospace; font-size: 12.5px; outline: none; transition: border-color 0.15s; }
    .field input:focus { border-color: var(--accent); }
    .field input::placeholder { color: var(--text-tertiary); }
    .field .hint { font-size: 11px; color: var(--text-tertiary); margin-top: 4px; }

    /* eBay page */
    .ebay-layout { display: grid; grid-template-columns: 320px 1fr; gap: 16px; align-items: start; }
    .ebay-sidebar { display: flex; flex-direction: column; gap: 12px; }
    .ebay-card { background: var(--bg-secondary); border: 1px solid var(--border-subtle); border-radius: 10px; padding: 18px; }
    .ebay-card h3 { font-size: 13px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
    .ebay-card .field select { width: 100%; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 7px; padding: 8px 10px; color: var(--text-primary); font-size: 12px; outline: none; }
    .ebay-card .field input { width: 100%; }
    .ebay-status { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 12px; }
    .ebay-status.ok { background: #22c55e18; color: var(--success); }
    .ebay-status.warn { background: #fb923c18; color: var(--warning); }
    .ebay-status.off { background: #ef444418; color: var(--danger); }
    .ebay-live-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
    .ebay-live-badge.live { background: #22c55e18; color: var(--success); }
    .ebay-live-badge.ended { background: #ef444418; color: var(--danger); }
    .ebay-live-badge.none { background: var(--bg-tertiary); color: var(--text-tertiary); }
    .ebay-listing-link { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--accent); text-decoration: none; }
    .ebay-listing-link:hover { text-decoration: underline; }
    .ebay-select-table { width: 100%; }
    .ebay-select-table th, .ebay-select-table td { padding: 10px 8px; }
    .ebay-select-table input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
    .ebay-log { max-height: 300px; overflow-y: auto; font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    .ebay-log-entry { padding: 6px 10px; border-bottom: 1px solid var(--border-subtle); display: flex; justify-content: space-between; }
    .ebay-log-entry.success { color: var(--success); }
    .ebay-log-entry.error { color: var(--danger); }
    .ebay-publish-bar { display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: var(--bg-secondary); border: 1px solid var(--border-subtle); border-radius: 10px; margin-bottom: 12px; }
    .ebay-count { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--accent); font-weight: 600; }
    @media (max-width: 900px) { .ebay-layout { grid-template-columns: 1fr; } }
    .connection-status { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-radius: 8px; font-size: 12.5px; font-weight: 500; margin-top: 16px; }
    .connection-status.connected { background: #22c55e14; color: var(--success); border: 1px solid #22c55e30; }
    .connection-status.disconnected { background: #ef444414; color: var(--danger); border: 1px solid #ef444430; }
    .connection-status.testing { background: #3b82f614; color: var(--info); border: 1px solid #3b82f630; }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-tertiary); }
    .empty-state p { font-size: 13px; }
    .loading-cell { text-align: center; padding: 40px !important; color: var(--text-tertiary); font-size: 13px; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.3s ease; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .pulse { animation: pulse 2s ease-in-out infinite; }

    @media (max-width: 900px) {
      .sidebar { width: 56px; }
      .sidebar-brand h1, .sidebar-brand .host, .nav-item span, .nav-badge { display: none; }
      .nav-item { justify-content: center; padding: 10px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .tire-grid { grid-template-columns: 1fr; }
      .modal-meta-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <h1>🛞 Tire Admin</h1>
        <div class="host" id="sidebar-host">not connected</div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
    </aside>
    <div class="main-content">
      <div class="topbar">
        <h2 id="page-title">Settings</h2>
        <div class="topbar-actions" id="topbar-actions"></div>
      </div>
      <div class="content-area" id="content"></div>
    </div>
  </div>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal" id="modal-content" style="position:relative">
      <div class="modal-close" onclick="closeModal()">✕</div>
    </div>
  </div>

  <script>
    // ── State ───────────────────────────────────────────────────────
    const state = {
      page: "settings",
      apiUrl: "",
      connected: false,
      products: [],
      _flatRows: [],
      studioCounts: {},

    // ── API ─────────────────────────────────────────────────────────
    async function apiFetch(endpoint) {
      const base = state.apiUrl ? state.apiUrl.replace(/\/$/, "") : "";
      const res = await fetch(base + endpoint);
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }

    async function apiPost(endpoint, body) {
      const base = state.apiUrl ? state.apiUrl.replace(/\/$/, "") : "";
      const res = await fetch(base + endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || "HTTP " + res.status);
      }
      return res.json();
    }

    // ── Metafield helpers ───────────────────────────────────────────
    function parseMetaValue(val) {
      if (val === null || val === undefined) return null;
      // Shopify can wrap values in JSON — try to unwrap
      if (typeof val === "string") {
        // Remove surrounding quotes if double-quoted JSON string: "\"hello\"" → hello
        if (val.startsWith('"') && val.endsWith('"')) {
          try { val = JSON.parse(val); } catch {}
        }
        // Try JSON parse for objects/arrays
        if (val.startsWith('{') || val.startsWith('[')) {
          try { return JSON.parse(val); } catch {}
        }
      }
      return val;
    }

    function getMeta(product, fieldKey) {
      if (!product.metafields || !product.metafields.length) return null;
      // Try exact namespace.key match first
      let mf = product.metafields.find(m => m.namespace === "custom" && m.key === fieldKey);
      // Fallback: match just the key
      if (!mf) mf = product.metafields.find(m => m.key === fieldKey);
      // Fallback: fuzzy match (key contains fieldKey or fieldKey contains key)
      if (!mf) mf = product.metafields.find(m =>
        m.key.replace(/-/g, "_").includes(fieldKey.replace(/-/g, "_")) ||
        fieldKey.replace(/-/g, "_").includes(m.key.replace(/-/g, "_"))
      );
      if (!mf) return null;
      return parseMetaValue(mf.value);
    }

    function getMetaAll(product) {
      const result = {};
      for (const f of TIRE_FIELDS) {
        result[f.key] = getMeta(product, f.key);
      }
      // Fallbacks: vendor as provider
      if (!result.tire_provider && product.vendor) result.tire_provider = product.vendor;
      // Build a display size string from width/height/rim
      result._size = [result.largeur, result.hauteur, result.rayon].filter(Boolean).join("/");
      return result;
    }

    function getEbayMeta(product) {
      if (!product.metafields || !product.metafields.length) return null;
      const ebay = {};
      for (const mf of product.metafields) {
        if (mf.namespace === "ebay") {
          ebay[mf.key] = mf.value;
        }
      }
      if (!ebay.listing_id) return null;
      return ebay;
    }

    function renderEbayBadge(product) {
      const ebay = getEbayMeta(product);
      if (!ebay) return '<span class="ebay-live-badge none">—</span>';
      const status = (ebay.ebay_status || "ACTIVE").toUpperCase();
      const isLive = status === "ACTIVE" || status === "PUBLISHED";
      const cls = isLive ? "live" : "ended";
      const icon = isLive ? "🟢" : "🔴";
      const url = ebay.ebay_url || `https://www.ebay.fr/itm/${ebay.listing_id}`;
      return `
        <div style="display:flex;flex-direction:column;gap:2px">
          <span class="ebay-live-badge ${cls}">${icon} ${isLive ? 'Live' : status}</span>
          <a href="${url}" target="_blank" class="ebay-listing-link">#${ebay.listing_id}</a>
        </div>`;
    }

    // Debug: log first product's metafields on load
    function debugMetafields() {
      if (!state.products.length) return;
      const p = state.products[0];
      console.group("🔍 Metafield Debug — " + p.title);
      console.log("Raw metafields:", p.metafields);
      console.log("Parsed meta:", p._meta);
      console.log("Metafield count:", (p.metafields || []).length);
      (p.metafields || []).forEach(m => {
        console.log(`  ${m.namespace}.${m.key} = ${m.value} (type: ${m.type})`);
      });
      console.groupEnd();
    }

    // ── Rendering helpers ───────────────────────────────────────────
    function seasonBadge(season) {
      if (!season) return '<span class="tire-meta-value">—</span>';
      const s = season.toLowerCase().replace(/[\s-]/g, "");
      let cls = "all-season";
      if (s.includes("winter") || s.includes("hiver")) cls = "winter";
      else if (s.includes("summer") || s.includes("été") || s.includes("ete")) cls = "summer";
      const icons = { winter: "❄️", summer: "☀️", "all-season": "🔄" };
      return `<span class="season-badge ${cls}">${icons[cls] || "🔄"} ${season}</span>`;
    }

    function conditionBadge(cond) {
      if (!cond) return "—";
      const c = cond.toLowerCase().trim();
      let cls = "fair";
      if (c === "a" || c.includes("excellent") || c.includes("new")) cls = "excellent";
      else if (c === "b" || c.includes("good") || c.includes("bon")) cls = "good";
      else if (c === "c" || c.includes("fair") || c.includes("moyen")) cls = "fair";
      else if (c === "d" || c.includes("poor") || c.includes("mauvais")) cls = "poor";
      return `<span class="condition-badge ${cls}">${cond}</span>`;
    }

    function treadDepthBar(depth) {
      if (!depth) return "—";
      const num = parseFloat(depth);
      if (isNaN(num)) return depth;
      // Assume max tread ~10mm for used tires
      const pct = Math.min(100, (num / 10) * 100);
      let cls = "good";
      if (pct < 30) cls = "low";
      else if (pct < 60) cls = "fair";
      return `<div class="tread-bar">
        <div class="tread-bar-track"><div class="tread-bar-fill ${cls}" style="width:${pct}%"></div></div>
        <span class="mono" style="font-size:9px">${num}mm</span>
      </div>`;
    }

    function statCard(label, value, accent) {
      const v = value === null || value === undefined ? '<span class="pulse">—</span>' : value;
      return `<div class="stat-card"><div class="stat-label">${label}</div><div class="stat-value ${accent ? 'accent' : ''}">${v}</div></div>`;
    }

    function statusBadge(s) {
      return `<span class="status-badge ${(s||"unknown").toLowerCase().replace(/\s/g,"")}">${s||"unknown"}</span>`;
    }

    function money(val) {
      return "$" + parseFloat(val || 0).toLocaleString("en", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    // ── Navigation ──────────────────────────────────────────────────
    function navigate(pageId) {
      state.page = pageId;
      renderSidebar();
      renderTopbar();
      renderContent();
    }

    function renderSidebar() {
      const nav = document.getElementById("sidebar-nav");
      nav.innerHTML = PAGES.map(p => `
        <div class="nav-item ${state.page === p.id ? 'active' : ''}" onclick="navigate('${p.id}')">
          ${ICONS[p.icon]}
          <span>${p.label}</span>
          ${p.id === 'settings' && !state.connected ? '<span class="nav-badge nav-warn">!</span>' : ''}
        </div>
      `).join("");
      document.getElementById("sidebar-host").textContent =
        state.connected ? (state.apiUrl ? new URL(state.apiUrl).host : window.location.host) : "not connected";
    }

    function renderTopbar() {
      document.getElementById("page-title").textContent = PAGES.find(p => p.id === state.page)?.label || "";
      const actions = document.getElementById("topbar-actions");
      actions.innerHTML = state.page !== "settings"
        ? `<button class="btn" onclick="renderContent()">${ICONS.refresh} Refresh</button>`
        : "";
    }

    let _renderVersion = 0;

    function renderContent() {
      const el = document.getElementById("content");
      _renderVersion++;
      el.dataset.rv = _renderVersion;
      if (!state.connected && state.page !== "settings") {
        el.innerHTML = `<div class="empty-state"><p>Connect your API first in <strong style="color:var(--accent);cursor:pointer" onclick="navigate('settings')">Settings</strong></p></div>`;
        return;
      }
      switch (state.page) {
        case "tires": return renderTires(el);
        case "ebay": return renderEbay(el);
        case "record-sale": return renderRecordSale(el);
        case "expenses": return renderExpenses(el);
        case "listings-ka": return renderListings(el, "kleinanzeigen");
        case "listings-lbc": return renderListings(el, "leboncoin");
        case "orders": return renderOrders(el);
        case "customers": return renderCustomers(el);
        case "inventory": return renderInventory(el);
        case "settings": return renderSettings(el);
      }
    }

    // ── TIRES PAGE ──────────────────────────────────────────────────
    async function renderTires(el) {
      const myRv = _renderVersion;
      el.innerHTML = `<div class="stats-grid">${statCard("Loading...", null, true)}${statCard("",null)}${statCard("",null)}${statCard("",null)}</div>
        <div style="text-align:center;padding:60px;color:var(--text-tertiary)"><span class="pulse">Loading all products with metafields — this may take a moment...</span></div>`;

      try {
        const [pRes, cRes, studioRes] = await Promise.all([
          apiFetch("/api/products/with-metafields"),
          apiFetch("/api/products/count"),
          apiFetch("/api/studio/sku-counts").catch(() => ({ sku_counts: {} })),
        ]);
        // Guard: don't overwrite if user navigated away during fetch
        if (el.dataset.rv != myRv) return;
        state.products = (pRes.products || []).map(p => ({ ...p, _meta: getMetaAll(p) }));
        state.studioCounts = studioRes.sku_counts || {};
        debugMetafields();
        const withMeta = state.products.filter(p => p.metafields && p.metafields.length > 0).length;
        console.log(`📊 Metafield coverage: ${withMeta}/${state.products.length} products have metafields`);
        const count = cRes.count ?? 0;

        // Extract unique values for filters
        const providers = [...new Set(state.products.map(p => p._meta.tire_provider).filter(Boolean))].sort();
        const models = [...new Set(state.products.map(p => p._meta.model).filter(Boolean))].sort();
        const categories = [...new Set(state.products.map(p => p.taxonomy_category).filter(Boolean))].sort();

        const avgTread = state.products.reduce((s, p) => {
          const d = parseFloat(p._meta.tread_depth);
          return isNaN(d) ? s : { sum: s.sum + d, n: s.n + 1 };
        }, { sum: 0, n: 0 });

        const totalSkus = state.products.reduce((s, p) => s + (p.variants?.length || 1), 0);
        const active = state.products.filter(p => p.status === "active" && p.published_at).length;
        const drafts = state.products.filter(p => p.status === "draft").length;
        const oos = state.products.filter(p => {
          if (p.status !== "active" || !p.published_at) return false;
          const totalQty = (p.variants || []).reduce((s, v) => s + (parseInt(v.inventory_quantity) || 0), 0);
          return totalQty <= 0;
        }).length;

        // Studio stats
        const studioSkus = Object.keys(state.studioCounts).length;
        const studioTotal = Object.values(state.studioCounts).reduce((s, c) => s + c.total, 0);
        const withMeta2 = state.products.filter(p => p.metafields && p.metafields.length > 0).length;

        el.innerHTML = `
          <div class="stats-grid fade-in" style="grid-template-columns:repeat(6,1fr)">
            ${statCard("Total SKUs", totalSkus, true)}
            ${statCard("🟢 Active", active)}
            ${statCard("📝 Draft", drafts)}
            ${statCard("🔴 Out of Stock", oos)}
            ${statCard("📷 Studio Pics", studioTotal + " (" + studioSkus + " SKUs)")}
            ${statCard("🏷️ Metafields", withMeta2 + " / " + state.products.length)}
          </div>

          <div class="filters-bar fade-in">
            <div class="filter-group">
              <label>Search</label>
              <input class="filter-input" placeholder="Title, SKU, category..." oninput="state.filters.search=this.value;renderTireGrid()" />

                <option value="">All Models</option>

              <button class="btn filter-reset" onclick="resetFilters()">Reset</button>

    function getWebStatus(product, qty) {
      const status = product.status;
      const published = !!product.published_at;
      if (status === "draft") return { cls: "ws-draft", label: "Draft", title: "Draft — not visible on website" };
      if (status === "archived") return { cls: "ws-archived", label: "Archived", title: "Archived — removed from website" };
      if (status === "active" && published && qty <= 0) return { cls: "ws-oos", label: "OOS", title: "Active but Out of Stock" };
      if (status === "active" && published) return { cls: "ws-active", label: "Active", title: "Live on website" };
      if (status === "active" && !published) return { cls: "ws-hidden", label: "Hidden", title: "Active but not published to website" };
      return { cls: "ws-unknown", label: "?", title: "Unknown status" };
    }

    function renderTireGrid() {
      const container = document.getElementById("tire-grid-container");
      if (!container) return;

      const f = state.filters;

      // Flatten: one row per variant (SKU)
      const rows = [];
      state.products.forEach((p, pIdx) => {
        const m = p._meta;
        const variants = p.variants && p.variants.length > 0 ? p.variants : [{}];
        variants.forEach(v => {
          const sku = v.sku || "—";
          if (f.search) {
            const q = f.search.toLowerCase();
            const searchable = `${p.title} ${m.tire_provider} ${m._size} ${m.model} ${m.largeur} ${sku} ${p.taxonomy_category || ""}`.toLowerCase();
            if (!searchable.includes(q)) return;
          }
          if (f.provider && m.tire_provider !== f.provider) return;
          if (f.model && m.model !== f.model) return;
          if (f.category && p.taxonomy_category !== f.category) return;
          if (f.webStatus) {
            const ws = getWebStatus(p, parseInt(m.tire_count || v.inventory_quantity || 0));
            const wsKey = ws.cls.replace("ws-", "");
            if (wsKey !== f.webStatus) return;
          }
          rows.push({ product: p, variant: v, meta: m, pIdx });
        });
      });

      if (rows.length === 0) {
        container.innerHTML = `<div class="empty-state"><p>No tires match your filters</p></div>`;
        return;
      }

      container.innerHTML = `

                  <td class="mono">${r.meta.arrival_date || "—"}</td>
                </tr>`;

    // ── EBAY PAGE ─────────────────────────────────────────────────
    async function renderEbay(el) {
      const myRv = _renderVersion;
      el.innerHTML = `<div class="empty-state"><span class="pulse">Loading eBay module...</span></div>`;

      // Fetch eBay status
      let ebayStatus = { configured: false, authenticated: false };
      try { ebayStatus = await apiFetch("/api/ebay/status"); } catch {}
      if (el.dataset.rv != myRv) return;

      // Fetch policies if authenticated
      let policies = { fulfillment: [], payment: [], return: [] };
      if (ebayStatus.authenticated) {
        try { policies = await apiFetch("/api/ebay/policies"); } catch {}
      }
      if (el.dataset.rv != myRv) return;
      state.ebay.policies = policies;

      // Get Shopify products if not loaded
      if (!state.products.length) {
        try {
          const pRes = await apiFetch("/api/products/with-metafields");
          state.products = (pRes.products || []).map(p => ({ ...p, _meta: getMetaAll(p) }));
        } catch {}
      }
      if (el.dataset.rv != myRv) return;

      // Build flat rows
      const rows = [];
      state.products.forEach(p => {
        const m = p._meta;
        (p.variants || [{}]).forEach(v => {
          const sku = v.sku || "";
          if (!sku) return;
          rows.push({ product: p, variant: v, meta: m, sku });
        });
      });

      const ffOpts = policies.fulfillment.map(p => `<option value="${p.fulfillmentPolicyId}">${p.name}</option>`).join("");
      const ppOpts = policies.payment.map(p => `<option value="${p.paymentPolicyId}">${p.name}</option>`).join("");
      const rrOpts = policies.return.map(p => `<option value="${p.returnPolicyId}">${p.name}</option>`).join("");

      el.innerHTML = `
        <div class="ebay-layout fade-in">
          <div class="ebay-sidebar">
            <!-- Connection -->
            <div class="ebay-card">
              <h3>🔗 Connection</h3>
              ${!ebayStatus.configured ? `
                <p style="font-size:12px;color:var(--text-secondary);margin-bottom:12px">
                  Set env vars on Railway:<br>
                  <code style="font-size:10px;color:var(--accent)">EBAY_CLIENT_ID, EBAY_CLIENT_SECRET, EBAY_REDIRECT_URI</code>
                </p>
                <span class="ebay-status off">⚠ Not Configured</span>
              ` : !ebayStatus.authenticated ? `
                <p style="font-size:12px;color:var(--text-secondary);margin-bottom:12px">
                  Click below to authorize with eBay France
                </p>
                <span class="ebay-status warn">⏳ Not Authenticated</span>
                <button class="btn btn-accent" style="margin-top:12px;width:100%" onclick="ebayConnect()">Connect eBay Account</button>
                <div style="margin-top:12px;border-top:1px solid var(--border-subtle);padding-top:12px">
                  <div class="field">
                    <label>Or paste refresh token</label>
                    <input id="ebay-refresh-token" placeholder="v^1.1#i^1#p^3#..." style="font-size:10px" />
                  </div>
                  <button class="btn" style="width:100%;margin-top:6px" onclick="ebaySetToken()">Save Token</button>
                </div>
              ` : `
                <span class="ebay-status ok">✓ Connected to eBay France</span>
              `}
            </div>

            ${ebayStatus.authenticated ? `
            <!-- Listing Settings -->
            <div class="ebay-card">
              <h3>⚙️ Listing Settings</h3>
              <div class="field">
                <label>eBay Category ID</label>
                <input id="ebay-category" value="179680" placeholder="e.g. 179680 (Pneus)" />
                <div class="hint">179680 = Pneus auto · <a href="https://www.isoldwhat.com" target="_blank" style="color:var(--accent)">Find ID</a></div>
              </div>
              <div class="field">
                <label>Fulfillment Policy</label>
                <select id="ebay-fulfillment">${ffOpts || '<option value="">— No policies —</option>'}</select>

            <div class="ebay-card" id="syncResultsCard" style="display:none">

                  <th>Provider</th>
                  <th>Price</th>
                  <th>Qty</th>
                  <th>Web</th>
                  <th>eBay</th>
                </tr></thead>
                <tbody>
                  ${rows.map(r => {
                    const price = r.variant.price || "—";

              <p style="font-size:14px">Connect your eBay account to start publishing</p>
              <p style="font-size:12px;color:var(--text-tertiary);margin-top:8px">
                1. Create an app at <a href="https://developer.ebay.com" target="_blank" style="color:var(--accent)">developer.ebay.com</a><br>
                2. Set EBAY_CLIENT_ID, EBAY_CLIENT_SECRET, EBAY_REDIRECT_URI on Railway<br>
                3. Click "Connect eBay Account" to authorize

            </div>
            `}

        </div>`;

      ebayUpdateCount();

    // ── eBay helpers ─────────────────────────────────────────────
    async function ebayConnect() {
      try {
        const data = await apiFetch("/api/ebay/auth/url");
        window.open(data.url, "_blank");
      } catch (e) {
        alert("Error getting auth URL: " + e.message);
      }
    }

    async function ebaySetToken() {
      const token = document.getElementById("ebay-refresh-token")?.value?.trim();
      if (!token) return alert("Paste a refresh token first");
      try {
        await apiPost("/api/ebay/auth/token", { refresh_token: token });
        alert("Token saved! Reloading...");
        renderEbay(document.getElementById("content"));
      } catch (e) {
        alert("Error: " + e.message);
      }
    }

    async function ebayCreatePolicies() {
      const btn = event.target;
      btn.disabled = true;
      btn.textContent = "⏳ Creating...";
      try {
        const result = await apiFetch("/api/ebay/policies/create-defaults");
        const ok = ["fulfillment","payment","return"].filter(k => result[k] && !result[k].status?.includes("error")).length;
        alert(`Created ${ok}/3 policies. Reloading...`);
        renderEbay(document.getElementById("content"));
      } catch (e) {
        alert("Error: " + e.message);
        btn.disabled = false;
        btn.textContent = "📋 Create Default Policies";
      }
    }

    function ebayToggleSku(sku, checked) {
      if (checked) state.ebay.selectedSkus.add(sku);
      else state.ebay.selectedSkus.delete(sku);
      ebayUpdateCount();
    }

    function ebayToggleAll(checked) {
      document.querySelectorAll(".ebay-sku-cb").forEach(cb => {
        cb.checked = checked;
        if (checked) state.ebay.selectedSkus.add(cb.dataset.sku);
        else state.ebay.selectedSkus.delete(cb.dataset.sku);
      });
      ebayUpdateCount();
    }

    function ebayUpdateCount() {
      const n = state.ebay.selectedSkus.size;
      const el = document.getElementById("ebay-selected-count");
      const btn = document.getElementById("ebay-publish-btn");
      if (el) el.textContent = n + " selected";
      if (btn) btn.disabled = n === 0;
    }

    async function ebayPublishSelected() {
      const skus = [...state.ebay.selectedSkus];
      if (!skus.length) return;

      const categoryId = document.getElementById("ebay-category")?.value || "179680";
      const ffId = document.getElementById("ebay-fulfillment")?.value;
      const ppId = document.getElementById("ebay-payment")?.value;
      const rrId = document.getElementById("ebay-return")?.value;
      const priceAdj = parseFloat(document.getElementById("ebay-price-adj")?.value || "0");

      if (!ffId || !ppId || !rrId) {
        alert("Please select fulfillment, payment, and return policies first.\nCreate them in eBay Seller Hub → Business Policies.");
        return;
      }

      if (!confirm(`Publish ${skus.length} tire(s) to eBay France?\n\nCategory: ${categoryId}\nPrice adjustment: €${priceAdj >= 0 ? "+" : ""}${priceAdj}`)) return;

      const btn = document.getElementById("ebay-publish-btn");
      btn.disabled = true;
      btn.textContent = "⏳ Publishing...";

      try {
        const result = await apiPost("/api/ebay/publish/bulk", {
          skus,
          category_id: categoryId,
          fulfillment_policy_id: ffId,
          payment_policy_id: ppId,
          return_policy_id: rrId,
          price_adjustment: priceAdj,
        });

        // Log full results to console for debugging
        console.group("📦 eBay Bulk Publish Results");
        console.log("Summary:", { total: result.total, published: result.published, failed: result.failed });
        (result.results || []).forEach(r => {
          if (r.status === "published") {
            console.log(`✅ ${r.sku} → listing #${r.listing_id}`);
          } else {
            console.error(`❌ ${r.sku} →`, r.errors || r.step || r);
          }
        });
        console.groupEnd();

        // Update log
        (result.results || []).forEach(r => {
          state.ebay.publishLog.unshift({
            sku: r.sku || "?",
            ok: r.status === "published",
            listingId: r.listing_id,
            error: r.status !== "published" ? JSON.stringify(r.errors || r.step || "unknown") : null,
          });
        });

        const failedSkus = (result.results || []).filter(r => r.status !== "published").map(r => r.sku);
        if (failedSkus.length > 0) {
          alert(`Published: ${result.published}/${result.total}\nFailed: ${result.failed}\n\n❌ Failed SKUs: ${failedSkus.join(", ")}\n\nCheck the Publish Log or browser console (F12) for details.`);
        } else {
          alert(`✅ All ${result.published} published successfully!`);
        }
        state.ebay.selectedSkus.clear();
        // Reload products to get updated eBay metafields
        try {
          const pRes = await apiFetch("/api/products/with-metafields");
          state.products = (pRes.products || []).map(p => ({ ...p, _meta: getMetaAll(p) }));
        } catch {}
        renderEbay(document.getElementById("content"));
      } catch (e) {
        alert("Publish error: " + e.message);
        btn.disabled = false;
        btn.textContent = "🚀 Publish to eBay France";
      }
    }

    async function ebayRefreshStatus() {
      const btn = event.target;
      btn.disabled = true;
      btn.textContent = "⏳ Refreshing...";
      try {
        const result = await apiPost("/api/ebay/listings/refresh-status", {});
        // Reload products to get updated metafields
        const pRes = await apiFetch("/api/products/with-metafields");
        state.products = (pRes.products || []).map(p => ({ ...p, _meta: getMetaAll(p) }));
        alert(`Refreshed ${result.updated} listing(s)`);
        renderEbay(document.getElementById("content"));
      } catch (e) {
        alert("Refresh error: " + e.message);
        btn.disabled = false;
        btn.textContent = "🔄 Refresh Listing Status";
      }
    }

    async function ebaySyncInventory() {
      const btn = event.target;
      if (!confirm("Sync eBay with Shopify?\n\nThis will:\n• Refresh all eBay listing statuses\n• Set Shopify inventory to 0 for sold/ended eBay items\n• Import eBay orders into sales database")) return;

      btn.disabled = true;
      btn.textContent = "⏳ Syncing...";
      try {
        const result = await apiPost("/api/ebay/sync", {});

        // Show results
        const card = document.getElementById("syncResultsCard");
        const div = document.getElementById("syncResults");
        card.style.display = "block";
        div.innerHTML = `
          <p><strong>✅ Checked:</strong> ${result.total_checked} listings</p>
          <p><strong>🔴 Ended & zeroed on Shopify:</strong> ${result.ended_and_zeroed}</p>
          <p><strong>📦 Sales imported:</strong> ${result.sales_import?.imported_count || 0}</p>
          <p><strong>⏭️ Sales skipped (duplicates):</strong> ${result.sales_import?.skipped_count || 0}</p>
          ${result.errors?.length ? `<p style="color:#f87171"><strong>Errors:</strong> ${result.errors.length}</p>` : ""}
          ${result.ended_products?.length ? `<p style="margin-top:8px"><strong>Ended items:</strong></p><ul style="margin:4px 0 0 16px">${result.ended_products.map(p => `<li>${p.sku || p.product_id} → inventory zeroed</li>`).join("")}</ul>` : ""}
        `;

        // Reload products
        const pRes = await apiFetch("/api/products/with-metafields");

        renderEbay(document.getElementById("content"));
      } catch (e) {
        alert("Sync error: " + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "🔄 Sync eBay → Shopify";
      }
    }

    // ── Orders / Customers / Inventory ────────────────────────────
    async function renderOrders(el) {
      el.innerHTML = `<div class="stats-grid">${statCard("Loading...", null, true)}</div><div class="table-container"><table><tbody><tr><td colspan="6" class="loading-cell"><span class="pulse">Loading orders...</span></td></tr></tbody></table></div>`;
      try {
        const [oRes, cRes] = await Promise.all([apiFetch("/api/orders?limit=50&status=any"), apiFetch("/api/orders/count")]);
        const orders = oRes.orders || []; const count = cRes.count ?? 0;
        const paid = orders.filter(o => o.financial_status === "paid").length;
        const revenue = orders.reduce((s, o) => s + parseFloat(o.total_price || 0), 0);
        el.innerHTML = `
          <div class="stats-grid fade-in">${statCard("Total Orders", count, true)}${statCard("Paid", paid)}${statCard("Revenue", money(revenue))}${statCard("Avg. Order", orders.length ? money(revenue / orders.length) : "—")}</div>
          <div class="table-container fade-in"><div class="table-header"><h3>Recent Orders</h3></div>
          <table><thead><tr><th>Order</th><th>SKUs</th><th>Customer</th><th>Fulfillment</th><th>Payment</th><th>Total</th><th>Date</th></tr></thead>
          <tbody>${orders.length === 0 ? '<tr><td colspan="7" class="loading-cell">No orders</td></tr>' :
            orders.map(o => {
              const skus = (o.line_items || []).map(li => li.sku).filter(Boolean).join(", ") || "—";
              return `<tr><td class="mono">${o.name}</td><td class="mono" style="color:var(--accent)">${skus}</td><td>${o.customer ? (o.customer.first_name||"")+" "+(o.customer.last_name||"") : o.email||"—"}</td><td>${statusBadge(o.fulfillment_status||"unfulfilled")}</td><td>${statusBadge(o.financial_status)}</td><td class="mono">${money(o.total_price)}</td><td>${new Date(o.created_at).toLocaleDateString()}</td></tr>`;
            }).join("")}
          </tbody></table></div>`;
      } catch (e) { el.innerHTML = `<div class="empty-state"><p>Error: ${e.message}</p></div>`; }
    }

    // ── LISTINGS PAGE ─────────────────────────────────────────────
    let lstPageOffset = 0;
    const LST_PAGE_SIZE = 15;
    let _lstFilter = 'all'; // all, active, sold, expired
    let _lstPlatform = ''; // kleinanzeigen or leboncoin

    async function renderListings(el, platform) {
      _lstPlatform = platform;
      el.innerHTML = `<div style="display:flex;justify-content:center;padding:20px"><span class="pulse" style="color:var(--text-tertiary)">Loading...</span></div>`;
      lstPageOffset = 0;
      _lstFilter = 'all';
      let allListings = [];
      try { const r = await apiFetch("/api/listings/?limit=500&platform=" + platform); allListings = Array.isArray(r) ? r : []; } catch(e) {}
      window._lstData = allListings;

      const active = allListings.filter(l => l.status === 'active').length;
      const sold = allListings.filter(l => l.status === 'sold').length;
      const expired = allListings.filter(l => l.status === 'expired').length;

      const isKA = platform === 'kleinanzeigen';
      const platformLabel = isKA ? 'Kleinanzeigen' : 'Leboncoin';
      const platformColor = isKA ? '#86b817' : '#ff6e14';
      const syncBtn = isKA
        ? `<button class="rs-submit" id="lst-sync-btn" onclick="lstSyncKleinanzeigen()" style="font-size:14px;padding:12px;width:100%">Sync from Kleinanzeigen</button>`
        : `<button class="rs-submit" id="lst-sync-lbc-btn" onclick="lstShowBookmarklet()" style="font-size:14px;padding:12px;width:100%;background:#ff6e14">Sync from Leboncoin</button>`;

      el.innerHTML = `
        <div class="rs-page fade-in">
          <div class="rs-stats-grid" id="lst-stats-grid">
            <div class="rs-stat-card"><div class="rs-stat-value" style="color:${platformColor}">${allListings.length}</div><div class="rs-stat-label">Total</div></div>
            <div class="rs-stat-card"><div class="rs-stat-value" style="color:#8BC34A">${active}</div><div class="rs-stat-label">Active</div></div>
            <div class="rs-stat-card"><div class="rs-stat-value" style="color:#ff6b6b">${sold}</div><div class="rs-stat-label">Sold</div></div>
            <div class="rs-stat-card"><div class="rs-stat-value" style="color:#888">${expired}</div><div class="rs-stat-label">Expired</div></div>
          </div>

          ${syncBtn}
          <div id="lst-sync-status" style="display:none;text-align:center;padding:8px;margin-bottom:12px;font-size:13px;color:var(--text-tertiary)"></div>

          <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;margin-top:16px">
            <button class="rs-chart-pill active" data-lstf="all" onclick="lstSetFilter(this)">All</button>
            <button class="rs-chart-pill" data-lstf="active" onclick="lstSetFilter(this)">Active</button>
            <button class="rs-chart-pill" data-lstf="sold" onclick="lstSetFilter(this)">Sold</button>
            <button class="rs-chart-pill" data-lstf="expired" onclick="lstSetFilter(this)">Expired</button>
          </div>

          <input type="text" id="lst-search" class="rs-search" placeholder="Search SKU..." inputmode="numeric" oninput="lstOnSearch(this)">

          <div class="rs-recent">
            <div class="rs-recent-header">
              <h3>${platformLabel}</h3>
              <span class="rs-total-badge" id="lst-total-badge">${allListings.length} listings</span>
              <button class="rs-download-btn" onclick="lstDownloadExcel()" title="Download as Excel">&#x2B07; Excel</button>
            </div>
            <div id="lst-list"></div>
            <div id="lst-pagination" style="display:flex;justify-content:center;gap:12px;padding:16px 0"></div>
          </div>
        </div>
      `;

      lstRenderList();
    }

    function lstGetFiltered() {
      let data = window._lstData || [];
      if (_lstFilter !== 'all') data = data.filter(l => l.status === _lstFilter);
      const q = (window._lstSearchQuery || '').trim().toLowerCase();
      if (q) data = data.filter(l => (l.sku || '').toLowerCase().includes(q));
      return data;
    }

    function lstSetFilter(btn) {
      document.querySelectorAll('[data-lstf]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      _lstFilter = btn.dataset.lstf;
      lstPageOffset = 0;
      lstRenderList();
    }

    function lstOnSearch(input) {
      window._lstSearchQuery = input.value;
      lstPageOffset = 0;
      lstRenderList();
    }

    function lstPlatformBadge(platform) {
      const colors = { kleinanzeigen: '#86b817', leboncoin: '#ff6e14' };
      const labels = { kleinanzeigen: 'KA', leboncoin: 'LBC' };
      const c = colors[platform] || 'var(--text-tertiary)';
      return '<span class="rs-sale-ch" style="color:' + c + '">' + (labels[platform] || platform) + '</span>';
    }

    function lstStatusBadge(status) {
      const colors = { active: '#8BC34A', sold: '#ff6b6b', expired: '#888' };
      const c = colors[status] || '#888';
      return '<span style="font-size:11px;padding:2px 6px;border-radius:4px;background:' + c + '22;color:' + c + ';font-weight:500">' + status + '</span>';
    }

    function lstRenderList() {
      const filtered = lstGetFiltered();
      const page = filtered.slice(lstPageOffset, lstPageOffset + LST_PAGE_SIZE);
      const listEl = document.getElementById("lst-list");
      const pagEl = document.getElementById("lst-pagination");
      if (!listEl) return;

      if (filtered.length === 0) {
        listEl.innerHTML = '<div class="rs-empty">' + (_lstFilter !== 'all' || window._lstSearchQuery ? 'No match' : 'No listings yet — use the Sync button above') + '</div>';
        pagEl.innerHTML = '';
        return;
      }

      listEl.innerHTML = page.map(l => `
        <div class="rs-sale-row" id="lst-row-${l.id}">
          <div class="rs-sale-line1">
            <span class="rs-sale-sku">${l.sku || '\u2014'}</span>
            <span class="rs-sale-price">${l.price ? l.price.toFixed(2) + ' \u20AC' : '\u2014'}</span>
            <button class="rs-del-btn" onclick="lstDelete('${l.id}', this)" title="Delete">\u2715</button>
          </div>
          <div class="rs-sale-line2">
            ${lstPlatformBadge(l.platform)}
            ${lstStatusBadge(l.status)}
            <span class="rs-sale-date">${l.listed_at ? new Date(l.listed_at).toLocaleDateString('fr-FR', {day:'2-digit',month:'short'}) : ''}</span>
            ${l.title ? '<span class="rs-sale-meta" style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + l.title.slice(0, 50) + '</span>' : ''}
            ${l.listing_url ? '<a href="' + l.listing_url + '" target="_blank" class="rs-sale-meta" style="color:var(--accent);text-decoration:none">\u{1F517}</a>' : ''}
            <select style="font-size:11px;padding:2px 4px;border-radius:4px;border:1px solid var(--border);background:var(--bg-secondary);color:var(--text-secondary);cursor:pointer" onchange="lstChangeStatus('${l.id}', this.value)">
              <option value="active" ${l.status === 'active' ? 'selected' : ''}>Active</option>
              <option value="sold" ${l.status === 'sold' ? 'selected' : ''}>Sold</option>
              <option value="expired" ${l.status === 'expired' ? 'selected' : ''}>Expired</option>
            </select>
          </div>
        </div>
      `).join("");

      const totalPages = Math.ceil(filtered.length / LST_PAGE_SIZE);
      const currentPage = Math.floor(lstPageOffset / LST_PAGE_SIZE) + 1;
      if (totalPages > 1) {
        pagEl.innerHTML = `
          <button class="rs-pager-btn" onclick="lstGotoPage(-1)" ${lstPageOffset === 0 ? 'disabled' : ''}>Previous</button>
          <span style="font-size:13px;color:var(--text-tertiary);align-self:center">${currentPage} / ${totalPages}</span>
          <button class="rs-pager-btn" onclick="lstGotoPage(1)" ${lstPageOffset + LST_PAGE_SIZE >= filtered.length ? 'disabled' : ''}>Next</button>
        `;
      } else {
        pagEl.innerHTML = '';
      }
    }

    function lstGotoPage(dir) {
      const all = lstGetFiltered();
      lstPageOffset += dir * LST_PAGE_SIZE;
      if (lstPageOffset < 0) lstPageOffset = 0;
      if (lstPageOffset >= all.length) lstPageOffset = Math.max(0, all.length - LST_PAGE_SIZE);
      lstRenderList();
      document.getElementById("lst-list").scrollIntoView({ behavior: "smooth" });
    }

    async function lstChangeStatus(id, newStatus) {
      try {
        const base = state.apiUrl ? state.apiUrl.replace(/\/$/, "") : "";
        const resp = await fetch(base + "/api/listings/" + id + "/status", {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status: newStatus }),
        });
        if (!resp.ok) throw new Error("HTTP " + resp.status);

        // Update local cache
        const item = (window._lstData || []).find(l => String(l.id) === String(id));
        if (item) item.status = newStatus;
        lstToast("Status updated to " + newStatus);
      } catch(e) {
        lstToast("Error: " + e.message, true);
      }
    }

    async function lstDelete(id, btn) {
      if (!btn.dataset.armed) {
        btn.dataset.armed = "1";
        btn.textContent = "?";
        btn.style.color = "#ff4444";
        setTimeout(() => { btn.dataset.armed = ""; btn.textContent = "\u2715"; btn.style.color = ""; }, 3000);
        return;
      }
      try {
        const base = state.apiUrl ? state.apiUrl.replace(/\/$/, "") : "";
        const resp = await fetch(base + "/api/listings/" + id, { method: "DELETE" });
        if (!resp.ok) throw new Error("HTTP " + resp.status);

        window._lstData = (window._lstData || []).filter(l => String(l.id) !== String(id));
        document.getElementById("lst-total-badge").textContent = window._lstData.length + ' listings';

        const row = document.getElementById("lst-row-" + id);
        if (row) { row.style.opacity = "0"; row.style.transition = "opacity 0.3s"; setTimeout(() => lstRenderList(), 300); }
        lstToast("Listing deleted");
      } catch(e) {
        lstToast("Error: " + e.message, true);
      }
    }

    function lstToast(msg, isError) {
      // Reuse the global toast pattern
      const existing = document.getElementById("lst-toast");
      if (existing) { existing.remove(); }
      const t = document.createElement("div");
      t.id = "lst-toast";
      t.className = "rs-toast show" + (isError ? " error" : "");
      t.textContent = msg;
      document.querySelector(".rs-page")?.appendChild(t);
      setTimeout(() => { t.className = "rs-toast"; setTimeout(() => t.remove(), 300); }, 3000);
    }

    async function lstSyncKleinanzeigen() {
      const btn = document.getElementById("lst-sync-btn");
      const status = document.getElementById("lst-sync-status");
      btn.disabled = true;
      btn.textContent = "Syncing...";
      status.style.display = "block";
      status.innerHTML = '<span class="pulse">Scraping Kleinanzeigen — this may take a minute...</span>';

      try {
        const base = state.apiUrl ? state.apiUrl.replace(/\/$/, "") : "";
        const resp = await fetch(base + "/api/listings/scrape-kleinanzeigen", { method: "POST" });
        if (!resp.ok) {
          const err = await resp.json().catch(() => ({}));
          throw new Error(err.detail || "HTTP " + resp.status);
        }
        const data = await resp.json();
        status.style.color = "var(--accent)";
        status.textContent = `Found ${data.found_on_ka} ads on KA — ${data.added} new, ${data.already_tracked} already tracked, ${data.expired} expired`;

        // Refresh list
        const r = await apiFetch("/api/listings/?limit=500&platform=kleinanzeigen");
        window._lstData = Array.isArray(r) ? r : [];
        document.getElementById("lst-total-badge").textContent = window._lstData.length + ' listings';
        lstPageOffset = 0;
        lstRenderList();
      } catch(e) {
        status.style.color = "#ff4444";
        status.textContent = "Sync failed: " + e.message;
      } finally {
        btn.disabled = false;
        btn.textContent = "Sync from Kleinanzeigen";
      }
    }

    async function lstImportLeboncoin(listings) {

      const status = document.getElementById("lst-sync-status");
      status.style.display = "block";
      status.innerHTML = '<span class="pulse">Importing ' + listings.length + ' Leboncoin listings...</span>';

      try {
        const base = state.apiUrl ? state.apiUrl.replace(/\/$/, "") : "";
        const resp = await fetch(base + "/api/listings/import-leboncoin", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ listings })
        });
        if (!resp.ok) {
          const err = await resp.json().catch(() => ({}));
          throw new Error(err.detail || "HTTP " + resp.status);
        }
        const data = await resp.json();
        status.style.color = "var(--accent)";
        status.textContent = `LBC: ${data.found_on_lbc} ads — ${data.added} new, ${data.already_tracked} tracked, ${data.expired} expired`;

        // Refresh list
        const r = await apiFetch("/api/listings/?limit=500&platform=leboncoin");
        window._lstData = Array.isArray(r) ? r : [];
        document.getElementById("lst-total-badge").textContent = window._lstData.length + ' listings';
        lstPageOffset = 0;
        lstRenderList();
      } catch(e) {
        status.style.color = "#ff4444";
        status.textContent = "LBC import failed: " + e.message;
      }

    function lstShowBookmarklet() {

    function lstDownloadExcel() {
      const listings = window._lstData || [];
      if (!listings.length) { lstToast('No listings to export', true); return; }

      const headers = ['ID','SKU','Platform','Title','Price (EUR)','Status','Listed At','URL'];
      const rows = listings.map(l => [
        l.id,
        l.sku || '',
        l.platform || '',
        (l.title || '').replace(/"/g, '""'),
        l.price != null ? l.price.toFixed(2) : '',
        l.status || '',
        l.listed_at || '',
        l.listing_url || ''
      ]);
      const csv = '\uFEFF' + [headers, ...rows].map(r => r.map(c => '"' + c + '"').join(',')).join('\n');

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'listings_export_' + new Date().toISOString().slice(0, 10) + '.csv';
      a.click();

    async function expOnFile(input) {
      const file = input.files[0];
      if (!file) return;

      // Show preview for images
      const preview = document.getElementById("exp-preview");
      const previewImg = document.getElementById("exp-preview-img");
      if (file.type.startsWith("image/")) {
        previewImg.src = URL.createObjectURL(file);
        preview.style.display = "block";
      } else {
        preview.style.display = "none";
      }

      // Send to Claude for parsing
      const parsing = document.getElementById("exp-parsing");
      parsing.style.display = "block";

      try {
        const formData = new FormData();
        formData.append("file", file);

        const base = state.apiUrl ? state.apiUrl.replace(/\/$/, "") : "";
        const resp = await fetch(base + "/api/expenses/parse-invoice", {
          method: "POST",
          body: formData,
        });

        if (!resp.ok) throw new Error("HTTP " + resp.status);
        const data = await resp.json();

        // Pre-fill form fields
        if (data.vendor) document.getElementById("exp-vendor").value = data.vendor;
        if (data.date) document.getElementById("exp-date").value = data.date;
        if (data.total) document.getElementById("exp-total").value = data.total.toFixed(2);
        if (data.image_path) document.getElementById("exp-image-path").value = data.image_path;

        if (data.error) {
          expToast("Invoice uploaded but could not auto-read — please fill in manually", true);
        } else {
          expToast("Invoice read successfully!");
        }
      } catch(e) {
        expToast("Could not read invoice: " + e.message, true);
      } finally {
        parsing.style.display = "none";
      }
    }

    async function expSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById("exp-submit-btn");
      btn.disabled = true;
      btn.textContent = "Saving...";

      try {
        const body = {
          expense_date: document.getElementById("exp-date").value,
          vendor: document.getElementById("exp-vendor").value,
          total_amount: parseFloat(document.getElementById("exp-total").value),
          notes: document.getElementById("exp-notes").value,
          image_path: document.getElementById("exp-image-path").value,
        };

        await apiPost("/api/expenses/", body);
        expToast("Expense recorded!");

        // Refresh
        const r = await apiFetch("/api/expenses/?limit=500");
        window._expData = Array.isArray(r) ? r : [];
        const total = window._expData.reduce((s, e) => s + (e.total_amount || 0), 0);
        document.getElementById("exp-total-badge").textContent = window._expData.length + ' expenses \u00B7 ' + total.toFixed(2) + ' EUR';

        // Reset form
        document.getElementById("exp-vendor").value = "";
        document.getElementById("exp-total").value = "";
        document.getElementById("exp-notes").value = "";
        document.getElementById("exp-image-path").value = "";
        document.getElementById("exp-preview").style.display = "none";

        expPageOffset = 0;
        expRenderList();
      } catch(e) {
        expToast("Error: " + e.message, true);
      } finally {
        btn.disabled = false;
        btn.textContent = "Record Expense";
      }
    }

    function expRenderList() {
      const filtered = window._expData || [];
      const page = filtered.slice(expPageOffset, expPageOffset + EXP_PAGE_SIZE);
      const listEl = document.getElementById("exp-list");
      const pagEl = document.getElementById("exp-pagination");
      if (!listEl) return;

      if (filtered.length === 0) {
        listEl.innerHTML = '<div class="rs-empty">No expenses recorded yet</div>';
        pagEl.innerHTML = '';
        return;
      }

      listEl.innerHTML = page.map(e => `
        <div class="rs-sale-row" id="exp-row-${e.id}">
          <div class="rs-sale-line1">
            <span class="rs-sale-sku" style="color:var(--text-primary)">${e.vendor || 'Unknown'}</span>
            <span class="rs-sale-price" style="color:#ff6b6b">${e.total_amount ? e.total_amount.toFixed(2) + ' \u20AC' : '\u2014'}</span>
            <button class="rs-del-btn" onclick="expDelete('${e.id}', this)" title="Delete">\u2715</button>
          </div>
          <div class="rs-sale-line2">
            <span class="rs-sale-date">${e.expense_date ? new Date(e.expense_date + 'T00:00:00').toLocaleDateString('fr-FR', {day:'2-digit',month:'short'}) : ''}</span>
            ${e.notes ? '<span class="rs-sale-meta">' + e.notes + '</span>' : ''}
            ${e.image_path ? '<a href="javascript:void(0)" onclick="expViewInvoice(\'' + e.image_path + '\')" class="rs-sale-meta" style="color:var(--accent);text-decoration:none;cursor:pointer">📎 View</a>' : ''}
          </div>
        </div>
      `).join("");

      const totalPages = Math.ceil(filtered.length / EXP_PAGE_SIZE);
      const currentPage = Math.floor(expPageOffset / EXP_PAGE_SIZE) + 1;
      if (totalPages > 1) {
        pagEl.innerHTML = `
          <button class="rs-pager-btn" onclick="expGotoPage(-1)" ${expPageOffset === 0 ? 'disabled' : ''}>Previous</button>
          <span style="font-size:13px;color:var(--text-tertiary);align-self:center">${currentPage} / ${totalPages}</span>
          <button class="rs-pager-btn" onclick="expGotoPage(1)" ${expPageOffset + EXP_PAGE_SIZE >= filtered.length ? 'disabled' : ''}>Next</button>
        `;
      } else {
        pagEl.innerHTML = '';
      }
    }

    function expGotoPage(dir) {
      const all = window._expData || [];
      expPageOffset += dir * EXP_PAGE_SIZE;
      if (expPageOffset < 0) expPageOffset = 0;
      if (expPageOffset >= all.length) expPageOffset = Math.max(0, all.length - EXP_PAGE_SIZE);
      expRenderList();
      document.getElementById("exp-list").scrollIntoView({ behavior: "smooth" });
    }

    async function expDelete(id, btn) {
      // Two-tap confirm like sales
      if (!btn.dataset.armed) {
        btn.dataset.armed = "1";
        btn.textContent = "?";
        btn.style.color = "#ff4444";
        setTimeout(() => { btn.dataset.armed = ""; btn.textContent = "\u2715"; btn.style.color = ""; }, 3000);
        return;
      }
      try {
        const base = state.apiUrl ? state.apiUrl.replace(/\/$/, "") : "";
        const resp = await fetch(base + "/api/expenses/" + id, { method: "DELETE" });
        if (!resp.ok) throw new Error("HTTP " + resp.status);

        // Remove from local cache
        window._expData = (window._expData || []).filter(e => String(e.id) !== String(id));
        const total = window._expData.reduce((s, e) => s + (e.total_amount || 0), 0);
        document.getElementById("exp-total-badge").textContent = window._expData.length + ' expenses \u00B7 ' + total.toFixed(2) + ' EUR';

        const row = document.getElementById("exp-row-" + id);
        if (row) { row.style.opacity = "0"; row.style.transition = "opacity 0.3s"; setTimeout(() => expRenderList(), 300); }
        expToast("Expense deleted");
      } catch(e) {
        expToast("Error: " + e.message, true);
      }
    }

    function expToast(msg, isError) {
      const t = document.getElementById("exp-toast");
      if (!t) return;
      t.textContent = msg;
      t.className = "rs-toast show" + (isError ? " error" : "");
      setTimeout(() => { t.className = "rs-toast"; }, 3000);
    }
